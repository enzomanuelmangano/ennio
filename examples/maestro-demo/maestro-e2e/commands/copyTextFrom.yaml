appId: com.ennio.maestrodemo
name: 'commands/copyTextFrom — copy counterValue then assert via maestro.copiedText'
tags:
  - passing
---
- launchApp:
    clearState: true
# Gate on the counter actually reaching 1 — the first tap on a freshly
# soft-reset screen is occasionally eaten (onPress doesn't fire); retry
# re-fires it until the increment lands, so copiedText is deterministically '1'.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: fabAddIcon
      - assertVisible:
          id: counterValue
          text: '1'
- copyTextFrom:
    id: counterValue
- assertTrue: "${maestro.copiedText} == '1'"
