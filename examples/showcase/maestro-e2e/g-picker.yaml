appId: com.ennio.example
name: 'Gauntlet — Picker'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-picker'
    direction: DOWN
- tapOn:
    id: 'g-picker'
- assertVisible:
    id: 'picker-screen'
- assertVisible:
    text: 'Selected: apple'
- assertVisible:
    id: 'picker-control'

# iOS: inline UIPickerView wheel. tapOn-by-text auto-routes to the native
# picker delegate (selectRow + didSelectRow) — the wheel rows are always
# visible, so each value is a direct tap.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Banana'
      - assertVisible:
          text: 'Selected: banana'
      - tapOn:
          text: 'Cherry'
      - assertVisible:
          text: 'Selected: cherry'
      - tapOn:
          text: 'Apple'
      - assertVisible:
          text: 'Selected: apple'

# Android: @react-native-picker/picker renders a native Spinner. Options
# aren't on screen until the Spinner is tapped to open its dropdown; the
# dropdown rows are real TextViews, so each select is "open control, tap
# value". (No virtual-node problem here — unlike the calendar day grid.)
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'picker-control'
      - tapOn:
          text: 'Banana'
      - assertVisible:
          text: 'Selected: banana'
      - tapOn:
          id: 'picker-control'
      - tapOn:
          text: 'Cherry'
      - assertVisible:
          text: 'Selected: cherry'
      - tapOn:
          id: 'picker-control'
      - tapOn:
          text: 'Apple'
      - assertVisible:
          text: 'Selected: apple'
