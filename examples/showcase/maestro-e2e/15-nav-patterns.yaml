appId: com.ennio.example
name: Navigation — formSheet, pageSheet, transparentModal, stacked modal
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-playground'
    direction: DOWN
- tapOn:
    id: 'g-playground'
- assertVisible:
    id: 'playground-scroll'
- scrollUntilVisible:
    element:
      text: 'Navigation patterns'
    direction: DOWN

# formSheet — header lands above the buttons; scroll a touch further so
# the actual `open-form-sheet-btn` is on-screen, not just its section
# heading.
- scrollUntilVisible:
    element:
      id: 'open-form-sheet-btn'
    direction: DOWN
- tapOn:
    id: 'open-form-sheet-btn'
- assertVisible:
    id: 'form-sheet-title'
- assertVisible:
    id: 'form-sheet-content'
- tapOn:
    id: 'form-sheet-close-btn'
- assertNotVisible:
    id: 'form-sheet-title'

# pageSheet
- tapOn:
    id: 'open-page-sheet-btn'
- assertVisible:
    id: 'page-sheet-title'
- tapOn:
    id: 'page-sheet-close-btn'
- assertNotVisible:
    id: 'page-sheet-title'

# transparentModal — backdrop visible + dismiss. The button sits below
# the page-sheet trigger; the page-sheet dismiss left the scroll
# position unchanged, so scroll into view first.
- scrollUntilVisible:
    element:
      id: 'open-transparent-modal-btn'
    direction: DOWN
- tapOn:
    id: 'open-transparent-modal-btn'
- assertVisible:
    id: 'transparent-modal-title'
- waitForAnimationToEnd
- tapOn: 'Close'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'transparent-modal-title'

# Stacked modals — outer + inner, dismiss in reverse
- tapOn:
    id: 'open-stacked-modal-btn'
- assertVisible:
    id: 'stacked-modal-title'
- tapOn:
    id: 'stacked-open-inner-btn'
- assertVisible:
    id: 'inner-modal-title'
# Outer should still be present beneath inner — visibility primitive should
# clamp queries to topmost presented VC. Inner-only assertion is the safer
# parity check across runners.
- tapOn:
    id: 'inner-modal-close-btn'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'inner-modal-title'
- assertVisible:
    id: 'stacked-modal-title'
- tapOn:
    id: 'stacked-close-outer-btn'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'stacked-modal-title'
