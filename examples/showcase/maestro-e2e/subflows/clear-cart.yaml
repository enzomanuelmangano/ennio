# Subflow: Clear cart if not empty

appId: com.ennio.example

---
- runFlow:
    file: navigate-cart.yaml

# Conditional cleanup — clear-cart-btn only present when cart has items.
- runFlow:
    when:
      visible:
        id: 'clear-cart-btn'
    commands:
      - tapOn:
          id: 'clear-cart-btn'
      - runFlow:
          when:
            visible: 'Clear'
          commands:
            - tapOn:
                text: 'Clear'
