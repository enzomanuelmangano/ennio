appId: com.ennio.example
name: 'Gauntlet — BottomSheet'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-bottomsheet'
    direction: DOWN
- tapOn:
    id: 'g-bottomsheet'
- assertVisible:
    id: 'bottomsheet-screen'
- tapOn:
    id: 'bottomsheet-open'
- assertVisible:
    id: 'bottomsheet-opened-marker'
- assertVisible:
    id: 'bottomsheet-body'
- tapOn:
    id: 'bottomsheet-close'
