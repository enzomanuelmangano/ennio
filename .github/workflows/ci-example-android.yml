# Example-app e2e (Android) — full maestro-e2e suite against a prebuilt APK.
#
# Android sibling of ci-example.yml (iOS). Same contract: the suite tests the
# RUNNER, not the app, so the app is a PREBUILT fixture — a universal, UNMODIFIED
# release APK (no debuggable flag, no config plugin, no Metro — Hermes bundle
# embedded) downloaded from the e2e-fixtures release and cached. CI never builds
# it. ennio injects its agent at runtime via ptrace.
#
# Why ptrace + a rootable emulator: ennio's "any app" injection (ptrace remote
# dlopen, see ptrace_inject.cpp) works on a NON-debuggable release build,
# exactly like the apps you ship. It needs root, which AOSP (`target: default`)
# emulator images provide via `adb root` — the Android parallel of the iOS
# Simulator's permissiveness. (`google_apis` images are NOT rootable.)
#
# x86_64 so the emulator runs KVM-accelerated on GitHub's Linux runners.
#
# Cost: $0 — public repo, standard GitHub-hosted Linux runner.
# Security posture mirrors ci-example: contents: read, actions pinned to SHAs,
# checkout with persist-credentials: false, no secrets.
#
# Trigger: manual —  gh workflow run ci-example-android.yml
name: ci-example-android

on:
  # Manual-only — same policy as ci-example / ci-wikipedia / ci-fast-build.
  # Re-enable a push/pull_request trigger once the Android flake rate is low
  # enough to gate merges on it.
  workflow_dispatch:
    inputs:
      no_animations:
        description: 'Run with --disable-animations (suppress app animations for speed)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: example-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENNIO_ABI: x86_64
  ANDROID_API: '34'
  NDK_VERSION: '27.1.12297006'
  BUILD_TOOLS: '35.0.0'
  # Prebuilt UNIVERSAL release APK (all ABIs → runs on the x86_64 emulator),
  # non-debuggable so ennio drives it via ptrace. Published once as an
  # e2e-fixtures release asset — same model as the iOS .app fixture in
  # ci-example.yml. The suite tests the runner, not the app, so the binary is
  # stable; CI never builds it. Refresh: rebuild the example release APK, upload
  # to a new e2e-fixtures tag, update this SHA + URL. v2 adds the native Android
  # action sheet (Alert) so g-action-sheet runs on Android; built arm64-v8a +
  # x86_64 (the CI emulator is x86_64).
  EXAMPLE_APK_SHA256: 6b9b91b518324d1937af112a0defd189df9d8e6032d980d93256e1d5840681fd
  EXAMPLE_APK_URL: https://github.com/enzomanuelmangano/ennio/releases/download/e2e-fixtures-v2/EnnioExample-android.apk
jobs:
  example-android:
    name: Example suite (Android emulator, ptrace inject)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (+ NDK, build-tools, platform)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build ennio CLI
        working-directory: packages/ennio
        run: bun run build

      - name: Build agent .so + ptrace injector (x86_64)
        run: ENNIO_ABI=x86_64 bash packages/ennio/android-inject/scripts/build-android.sh

      # The example APK is a prebuilt FIXTURE (hosted release asset), never built
      # in CI — cache it across runs keyed by its SHA, download on a cache miss.
      - name: Cache example APK fixture
        id: apk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/exampleapk
          key: example-apk-${{ env.EXAMPLE_APK_SHA256 }}

      - name: Download example APK fixture (cache miss)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p /tmp/exampleapk
          curl -fsSL --retry 3 -o /tmp/exampleapk/app-release.apk "$EXAMPLE_APK_URL"
          echo "${EXAMPLE_APK_SHA256}  /tmp/exampleapk/app-release.apk" | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator-runner executes its `script` line-by-line via /bin/sh, so
      # shell variables/exports do NOT persist across lines. Put the whole suite
      # in a real bash script the action invokes as ONE command instead.
      - name: Prepare suite script
        env:
          ENNIO_NO_ANIM_FLAG: ${{ inputs.no_animations && '--disable-animations' || '' }}
        run: |
          cat > /tmp/run-suite.sh <<EOF
          #!/usr/bin/env bash
          set -u
          adb wait-for-device
          # adb root restarts adbd → the command's own connection resets and it
          # returns non-zero even on success; tolerate it, then wait for adbd.
          adb root || true
          adb wait-for-device
          sleep 3
          adb install -r -g /tmp/exampleapk/app-release.apk
          export ENNIO_PLATFORM=android
          export ENNIO_ANDROID_AGENT=/tmp/ennio-android/libennio.so
          export ENNIO_ANDROID_INJECTOR=/tmp/ennio-android/ennio_ptrace
          NO_ANIM='${ENNIO_NO_ANIM_FLAG}'
          mkdir -p /tmp/ennio-logs
          PASS=0; FAIL=0; FAILED=""
          for f in example/maestro-e2e/*.yaml; do
            base=\$(basename "\$f")
            case "\$base" in _*|00-*) continue;; esac
            ok=0
            for attempt in 1 2; do
              if node packages/ennio/dist/cli.js test "\$f" --verbose \$NO_ANIM \
                  > "/tmp/ennio-logs/\$base.\$attempt.log" 2>&1; then
                ok=1; break
              fi
              echo "RETRY \$base (attempt \$attempt failed)"
            done
            if [ "\$ok" -eq 1 ]; then
              echo "PASS  \$base"; PASS=\$((PASS+1))
            else
              echo "FAIL  \$base"; tail -30 "/tmp/ennio-logs/\$base.2.log"
              FAIL=\$((FAIL+1)); FAILED="\$FAILED \$base"
            fi
          done
          echo ""
          echo "Example suite (Android): Pass=\$PASS Fail=\$FAIL\${FAILED:+ — failed:\$FAILED}"
          [ "\$FAIL" -eq 0 ]
          EOF
          chmod +x /tmp/run-suite.sh

      - name: Run example suite (boot emulator + drive)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: x86_64
          target: default # AOSP image → adb root works (ptrace needs it)
          # Pixel 3a profile (1080x2220). The default emulator device is
          # shorter, pushing a 2-item cart's second row below the fold so
          # `assertVisible cart-item-2` failed (03-cart, 04-checkout) — the
          # iOS fixture and a normal phone show both rows. Pin the geometry.
          profile: pixel_3a
          # ram-size 4096: the default device RAM starves system_server under
          # the app + ptrace agent, ANR-ing it ("Process system isn't
          # responding") — the ANR dialog steals input focus so taps/finds
          # silently miss (03 remove-item-2) and launchApp ballooned to 31s+.
          # The emulator `-memory` flag is overridden by the AVD's config.ini,
          # so the device RAM must be set via the runner's ram-size input,
          # which edits hw.ramSize at AVD creation. force-avd-creation: true
          # guarantees the (re)created AVD picks up the new size. The ubuntu
          # runner has 16GB, so 4GB device RAM is safe — it makes the CI
          # emulator behave like the healthy 4GB local AVD (suite: 40/40).
          ram-size: 4096M
          heap-size: 576M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash /tmp/run-suite.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-android-logs
          path: |
            /tmp/ennio-logs/
            /tmp/ennio-shots/
          retention-days: 7
          if-no-files-found: warn
