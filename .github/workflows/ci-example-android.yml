# Example-app e2e (Android) — full maestro-e2e suite against a prebuilt APK.
#
# Android sibling of ci-example.yml (iOS). Same contract: the suite tests the
# RUNNER, not the app. The app is built here as an ordinary, UNMODIFIED release
# APK (no debuggable flag, no config plugin, no Metro — Hermes bundle embedded),
# then ennio injects its agent at runtime via ptrace.
#
# Why ptrace + a rootable emulator: ennio's "any app" injection (ptrace remote
# dlopen, see ptrace_inject.cpp) works on a NON-debuggable release build,
# exactly like the apps you ship. It needs root, which AOSP (`target: default`)
# emulator images provide via `adb root` — the Android parallel of the iOS
# Simulator's permissiveness. (`google_apis` images are NOT rootable.)
#
# x86_64 so the emulator runs KVM-accelerated on GitHub's Linux runners.
#
# Cost: $0 — public repo, standard GitHub-hosted Linux runner.
# Security posture mirrors ci-example: contents: read, actions pinned to SHAs,
# checkout with persist-credentials: false, no secrets.
#
# Trigger: manual —  gh workflow run ci-example-android.yml
name: ci-example-android

on:
  workflow_dispatch:
    inputs:
      no_animations:
        description: 'Run with --no-animations (suppress app animations for speed)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: example-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENNIO_ABI: x86_64
  ANDROID_API: '34'
  NDK_VERSION: '27.1.12297006'
  BUILD_TOOLS: '35.0.0'

jobs:
  example-android:
    name: Example suite (Android emulator, ptrace inject)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (+ NDK, build-tools, platform)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build ennio CLI
        working-directory: packages/ennio
        run: bun run build

      - name: Build agent .so + ptrace injector (x86_64)
        run: ENNIO_ABI=x86_64 bash packages/ennio/android-inject/scripts/build-android.sh

      - name: Generate native android project (expo prebuild)
        working-directory: example
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build release APK (Metro-less, Hermes bundle embedded)
        working-directory: example/android
        # Sign the release with the debug keystore so it installs (test build).
        run: ./gradlew --no-daemon assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run example suite (boot emulator + drive)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        env:
          ENNIO_NO_ANIM_FLAG: ${{ inputs.no_animations && '--no-animations' || '' }}
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: x86_64
          target: default # AOSP image → adb root works (ptrace needs it)
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -uo pipefail
            adb wait-for-device
            adb root && adb wait-for-device # ptrace injection runs as root
            APK=example/android/app/build/outputs/apk/release/app-release.apk
            adb install -r -g "$APK"
            UDID=$(adb devices | awk '/emulator-/{print $1; exit}')
            test -n "$UDID" || { echo "no emulator serial"; exit 1; }
            echo "emulator: $UDID  mode: ${ENNIO_NO_ANIM_FLAG:-default}"
            mkdir -p /tmp/ennio-logs
            export ENNIO_UDID="$UDID" ENNIO_PLATFORM=android
            export ENNIO_ANDROID_AGENT=/tmp/ennio-android/libennio.so
            export ENNIO_ANDROID_INJECTOR=/tmp/ennio-android/ennio_ptrace
            PASS=0; FAIL=0; FAILED=""
            for f in example/maestro-e2e/*.yaml; do
              base=$(basename "$f")
              [[ "$base" == _* ]] && continue
              [[ "$base" == 00-* ]] && continue
              ok=0
              for attempt in 1 2; do
                if node packages/ennio/dist/cli.js test "$f" --verbose $ENNIO_NO_ANIM_FLAG \
                    > "/tmp/ennio-logs/$base.$attempt.log" 2>&1; then
                  ok=1; break
                fi
                echo "RETRY $base (attempt $attempt failed)"
              done
              if [ "$ok" -eq 1 ]; then
                echo "PASS  $base"; PASS=$((PASS+1))
              else
                echo "FAIL  $base"; tail -30 "/tmp/ennio-logs/$base.2.log"
                FAIL=$((FAIL+1)); FAILED="$FAILED $base"
              fi
            done
            echo ""
            echo "Example suite (Android): Pass=$PASS Fail=$FAIL${FAILED:+ — failed:$FAILED}"
            [ "$FAIL" -eq 0 ]

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-android-logs
          path: |
            /tmp/ennio-logs/
            /tmp/ennio-shots/
          retention-days: 7
          if-no-files-found: warn
