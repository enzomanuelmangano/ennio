# One-off builder for the react-navigation iOS Release fixture, with the SAME
# Xcode the e2e runners use (16.4). A fixture built with a newer Xcode (26)
# breaks ennio's DYLD-injected control socket on the runner's iOS runtimes —
# the dylib bootstraps but the socket never binds (verified). Building with the
# runner toolchain, like the bsky / example fixtures, fixes it.
#
# Output: an artifact `ReactNavigationExample-ios-Release.app.zip` to download,
# SHA-256, and upload to the e2e-fixtures release; then point ci-react-nav at it.
name: build-rnnav-ios-fixture

on:
  workflow_dispatch: {}
  # Scoped to this file so it only builds when the builder itself changes
  # (workflow_dispatch needs the default branch; this runs it from the PR).
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rnnav-ios-fixture.yml'

permissions:
  contents: read

env:
  RNNAV_SHA: 211c1d821efc1344a186a1a2da6dfe835e8d418a

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          for x in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app; do
            if [ -d "/Applications/$x" ]; then sudo xcode-select -switch "/Applications/$x"; break; fi
          done
          xcodebuild -version

      - name: Clone react-navigation (pinned)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/react-navigation/react-navigation.git /tmp/rnnav
          git -C /tmp/rnnav checkout "$RNNAV_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # react-navigation@211c1d82 pins v24.13.0 (.nvmrc); node-version-file
          # can't take the absolute /tmp clone path (it resolves vs the
          # workspace), so pin it directly.
          node-version: '24.13.0'

      - name: Install deps (yarn 4, immutable)
        working-directory: /tmp/rnnav
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Prebuild + build Release .app (iphonesimulator)
        working-directory: /tmp/rnnav/example
        run: |
          set -euo pipefail
          yarn expo prebuild --platform ios
          xcodebuild ONLY_ACTIVE_ARCH=NO \
            -workspace ios/ReactNavigationExample.xcworkspace \
            -scheme ReactNavigationExample \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          APP=ios/build/Build/Products/Release-iphonesimulator/ReactNavigationExample.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" /tmp/ReactNavigationExample-ios-Release.app.zip
          shasum -a 256 /tmp/ReactNavigationExample-ios-Release.app.zip

      - name: Upload fixture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReactNavigationExample-ios-Release
          path: /tmp/ReactNavigationExample-ios-Release.app.zip
          retention-days: 3
          if-no-files-found: error
