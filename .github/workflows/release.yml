name: release

# Publishes @reactiive/ennio to npm when a v* tag is pushed (or manually).
# Flow: bump packages/ennio/package.json version → commit → `git tag vX.Y.Z`
# → `git push origin vX.Y.Z` → this workflow publishes that version.
#
# The prebuilt dylib + SHA-256 manifest are committed under packages/ennio/
# prebuilt/, so CI only builds the Node CLI (no Xcode / dylib rebuild).
# Provenance is emitted via `--provenance` (needs id-token: write + a public
# repo), restoring the Sigstore attestation the README advertises.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest | beta)'
        required: false
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build + typecheck + unit tests
        working-directory: packages/ennio
        run: |
          bun run build
          bun run typecheck
          bun run test

      - name: Guard — tag version must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/ennio
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG != package.json $PKG"; exit 1
          fi

      - name: Publish (with provenance)
        working-directory: packages/ennio
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
