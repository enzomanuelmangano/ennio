# Maestro-demo conformance (Android) — outcome-asserting suite against a prebuilt APK.
#
# Android sibling of ci-maestro-demo.yml (iOS). Same contract: the suite tests the
# RUNNER, not the app, so the app is a PREBUILT fixture — a universal, UNMODIFIED
# release APK (no debuggable flag, no config plugin, no Metro — Hermes bundle
# embedded) downloaded from the e2e-fixtures release and cached. CI never builds
# it. ennio injects its agent at runtime via ptrace. The harness
# (examples/maestro-demo/run-suite.sh) runs every flow and ASSERTS its declared
# outcome, exiting non-zero on any regression except tracked KNOWN_XPASS.
#
# Why ptrace + a rootable emulator: ennio's "any app" injection (ptrace remote
# dlopen, see ptrace_inject.cpp) works on a NON-debuggable release build,
# exactly like the apps you ship. It needs root, which AOSP (`target: default`)
# emulator images provide via `adb root` — the Android parallel of the iOS
# Simulator's permissiveness. (`google_apis` images are NOT rootable.)
#
# x86_64 so the emulator runs KVM-accelerated on GitHub's Linux runners.
#
# Cost: $0 — public repo, standard GitHub-hosted Linux runner.
# Security posture mirrors ci-maestro-demo: contents: read, actions pinned to SHAs,
# checkout with persist-credentials: false, no secrets.
#
# Triggers: pull_request (paths-filtered) + manual dispatch.
name: ci-maestro-demo-android

on:
  # The harness (run-suite.sh) hard-codes its per-flow CLI invocation and
  # doesn't take an animation flag; the emulator-runner already disables
  # device animations below. So manual dispatch carries no inputs.
  workflow_dispatch:
  # Every PR that can affect the Android runner or the maestro-demo suite.
  #
  # src/** is the shared cross-platform CLI (runner, settle, rpc, driver
  # core) — a change there genuinely affects Android, so it triggers here.
  # Only the provably iOS-only TS below is carved out with negations
  # (last-match-wins, per file): the iOS-simulator manager (sim.ts) and
  # the iOS platform adapter never run on Android. ios/** native isn't
  # listed at all, so it never triggers Android.
  pull_request:
    branches: [main]
    paths:
      - 'packages/ennio/src/**'
      - '!packages/ennio/src/cli/platform/ios.ts'
      - '!packages/ennio/src/cli/sim.ts'
      - '!packages/ennio/src/cli/sim.test.ts'
      - 'packages/ennio/android/**'
      - 'packages/ennio/android-inject/**'
      - 'packages/ennio/cpp/**'
      - 'examples/maestro-demo/**'
      - '.github/workflows/ci-maestro-demo-android.yml'

permissions:
  contents: read

concurrency:
  group: maestro-demo-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENNIO_ABI: x86_64
  ANDROID_API: '34'
  NDK_VERSION: '27.1.12297006'
  BUILD_TOOLS: '35.0.0'
  # Prebuilt UNIVERSAL release APK (all ABIs → runs on the x86_64 emulator),
  # non-debuggable so ennio drives it via ptrace. Published once as an
  # e2e-fixtures release asset — same model as the iOS .app fixture in
  # ci-maestro-demo.yml. The suite tests the runner, not the app, so the binary
  # is stable; CI never builds it. Refresh: rebuild the maestro-demo release APK,
  # upload to a new e2e-fixtures tag, update this SHA + URL.
  MAESTRO_DEMO_APK_SHA256: e2eb00ea5ec8c9bcc3614eed217dcec75dc2db45c2b41e79ed379383692a0f68
  MAESTRO_DEMO_APK_URL: https://github.com/enzomanuelmangano/ennio/releases/download/e2e-fixtures-v2/MaestroDemo-android.apk
jobs:
  # Cheap pre-flight on a Linux runner: don't boot a simulator/emulator
  # for a PR that can't even lint, typecheck, format, or build. The
  # expensive job below only starts once this passes.
  gate:
    name: Fast checks gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build

  maestro-demo-android:
    name: Maestro-demo conformance (Android emulator, ptrace inject)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (+ NDK, build-tools, platform)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build ennio CLI
        working-directory: packages/ennio
        run: bun run build

      - name: Build agent .so + ptrace injector (x86_64)
        run: ENNIO_ABI=x86_64 bash packages/ennio/android-inject/scripts/build-android.sh

      # The maestro-demo APK is a prebuilt FIXTURE (hosted release asset), never
      # built in CI — cache it across runs keyed by its SHA, download on a miss.
      - name: Cache maestro-demo APK fixture
        id: apk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/mdemo-apk
          key: maestro-demo-apk-${{ env.MAESTRO_DEMO_APK_SHA256 }}

      - name: Download maestro-demo APK fixture (cache miss)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p /tmp/mdemo-apk
          curl -fsSL --retry 3 -o /tmp/mdemo-apk/app-release.apk "$MAESTRO_DEMO_APK_URL"
          echo "${MAESTRO_DEMO_APK_SHA256}  /tmp/mdemo-apk/app-release.apk" | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator-runner executes its `script` line-by-line via /bin/sh, so
      # shell variables/exports do NOT persist across lines. Put the whole suite
      # in a real bash script the action invokes as ONE command instead.
      - name: Prepare suite script
        run: |
          cat > /tmp/run-suite-ci.sh <<EOF
          #!/usr/bin/env bash
          set -u
          adb wait-for-device
          # adb root restarts adbd → the command's own connection resets and it
          # returns non-zero even on success; tolerate it, then wait for adbd.
          adb root || true
          adb wait-for-device
          # Event-based readiness instead of a blind sleep: wait for the boot to
          # actually complete (adbd is back after `adb root`, and the package
          # manager is up to accept the install). Bounded so a wedged boot still
          # fails fast rather than hanging.
          boot_deadline=\$((SECONDS + 120))
          until [ "\$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; do
            [ "\$SECONDS" -ge "\$boot_deadline" ] && { echo "boot_completed never set"; break; }
            sleep 1
          done
          adb install -r -g /tmp/mdemo-apk/app-release.apk
          export ENNIO_PLATFORM=android
          export ENNIO_ANDROID_AGENT=/tmp/ennio-android/libennio.so
          export ENNIO_ANDROID_INJECTOR=/tmp/ennio-android/ennio_ptrace
          # Resolve the booted emulator serial for the harness (ENNIO_UDID).
          SERIAL=\$(adb get-serialno)
          export ENNIO_UDID="\$SERIAL"
          # Outcome-asserting harness: run-suite.sh runs every flow and asserts
          # its declared outcome (passing flows must pass, failing flows must
          # fail), exiting non-zero on any regression except tracked KNOWN_XPASS.
          # Per-flow logs land in /tmp/mdemo-suite-log.
          examples/maestro-demo/run-suite.sh android
          EOF
          chmod +x /tmp/run-suite-ci.sh

      - name: Run maestro-demo suite (boot emulator + drive)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: x86_64
          target: default # AOSP image → adb root works (ptrace needs it)
          # Pixel 3a profile (1080x2220). The default emulator device is
          # shorter, pushing content below the fold; pin the geometry so the
          # iOS fixture and the Android emulator render the same screens.
          profile: pixel_3a
          # ram-size 4096: the default device RAM starves system_server under
          # the app + ptrace agent, ANR-ing it ("Process system isn't
          # responding") — the ANR dialog steals input focus so taps/finds
          # silently miss and launchApp balloons. The emulator `-memory` flag
          # is overridden by the AVD's config.ini, so the device RAM must be
          # set via the runner's ram-size input, which edits hw.ramSize at AVD
          # creation. force-avd-creation: true guarantees the (re)created AVD
          # picks up the new size. The ubuntu runner has 16GB, so 4GB device
          # RAM is safe.
          ram-size: 4096M
          heap-size: 576M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash /tmp/run-suite-ci.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-demo-android-logs
          path: |
            /tmp/mdemo-suite-log/
          retention-days: 7
          if-no-files-found: warn
