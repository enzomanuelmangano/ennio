# Bluesky e2e — the full upstream 17-flow suite driven by ennio against a
# prebuilt Release fixture, on a free GitHub-hosted macOS runner.
#
# The suite tests the RUNNER against a real-world app, so the app binary is
# a stable fixture published as a GitHub release asset (e2e-fixtures-v2,
# bsky e2e Release build: EXPO_PUBLIC_ENV=e2e RN_SRC_EXT=e2e.ts,e2e.tsx,
# jsbundle embedded, no dev client) — never rebuilt in CI.
#
# The bluesky repo is cloned at a pinned commit and patched:
#   - setup-app-release.patch    drop the Expo dev-client openLink block
#                                (Metro-only; the fixture is a Release build)
#   - dev-env-double-buffer.patch L4 proxy on :3000 + standby TestNetwork
#                                pre-warm (mock ?users 3.4s -> ~0.5s)
#
# The mock backend (@atproto/dev-env) needs postgres + redis. Upstream wraps
# them in docker, which GitHub macOS runners don't have — but the wrapper
# only exports DB_POSTGRES_URL/REDIS_HOST, so brew services + two env vars
# replace it entirely.
#
# Cost: $0 — public repo, standard GitHub-hosted runner.
#
# Security posture (mirrors ci-wikipedia/ci-example):
#   - permissions: contents: read
#   - actions pinned to full commit SHAs
#   - checkout with persist-credentials: false
#   - fixture download SHA-256-verified before unzip/install
#   - bluesky cloned at a pinned commit SHA
#   - no secrets consumed
#
# Trigger: manual for now — gh workflow run ci-bsky.yml
name: ci-bsky

on:
  workflow_dispatch:
    inputs:
      flow_filter:
        description: 'Run only flows whose name starts with this prefix (empty = all)'
        type: string
        default: ''
  # Temporary while iterating: new workflow files aren't dispatchable via
  # the API until they exist on the default branch. Remove before merge.
  push:
    branches: [ci/bsky-e2e-suite]

permissions:
  contents: read

concurrency:
  group: bsky-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of Bluesky-ios-e2e-Release.app.zip from the e2e-fixtures-v2
  # release. Built from bluesky@c02f2a1e (v1.122.0) — refresh procedure in
  # the release notes.
  BSKY_APP_ZIP_SHA256: 4884d33510a3a3f46b137fac73d1753c5bb4a9a98f719252d35ff1655600090e
  BSKY_APP_URL: https://github.com/enzomanuelmangano/ennio/releases/download/e2e-fixtures-v2/Bluesky-ios-e2e-Release.app.zip
  # bluesky commit the fixture was built from — flows + dev-env must match.
  BSKY_SHA: c02f2a1eda66246ed76e91a6d12f440bc1c581c3
  BSKY_BUNDLE_ID: xyz.blueskyweb.app

jobs:
  bsky:
    name: Bluesky suite (iOS sim, prebuilt fixture)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19

      # mock-server.ts runs as native-TS node (type stripping) — needs >=23.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Xcode 16.x, NOT 26: the fixture (bsky v1.122) is only proven on the
      # iOS 18.x runtime. On iOS 26 the suite hits app SIGABRT crashes
      # (avatar creator, feed render) and the photo picker never presents —
      # app-runtime incompatibilities, not runner issues.
      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          for x in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app; do
            if [ -d "/Applications/$x" ]; then sudo xcode-select -switch "/Applications/$x"; break; fi
          done
          xcodebuild -version
          xcrun simctl list runtimes

      # Kick the boot FIRST and don't wait — CoreSimulator boots in the
      # background (~90s) while the JS/dylib builds and the mock backend
      # come up. The later "Wait for simulator" step pays only the
      # remainder. (Lesson from ci-example perf work: serial boot was a
      # pure 97s tax.)
      - name: Start simulator boot (async)
        id: boot
        run: |
          set -euo pipefail
          # Create a dedicated device pinned to the iOS 18 runtime —
          # `simctl boot <name>` resolves an ambiguous name to an arbitrary
          # device, which on this image is the iOS 26 one (where bsky
          # v1.122 crashes). Explicit runtime, explicit UDID.
          # head -1 = OLDEST iOS 18 runtime on the image (18.5). On 18.6 the
          # e2e picker mock's DCIM read silently fails (image flows hang);
          # 18.5 matches the locally-verified behavior.
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-18-[0-9]+' | head -1)
          test -n "$RUNTIME" || { echo "No iOS 18 runtime on image"; xcrun simctl list runtimes; exit 1; }
          UDID=$(xcrun simctl create "bsky-e2e" "iPhone 16 Pro" "$RUNTIME")
          echo "created $UDID on $RUNTIME"
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build ennio CLI
        working-directory: packages/ennio
        run: bun run build

      - name: Build dylib + HID helper
        working-directory: packages/ennio
        run: |
          set -euo pipefail
          bash scripts/build-dylib-local.sh
          bash scripts/build-hid-helper.sh

      - name: Start postgres + redis (brew, no docker)
        run: |
          set -euo pipefail
          # The dev-env docker wrapper only exports these connection details —
          # brew services provide the same contract.
          brew install postgresql@16 redis >/dev/null || true
          brew services start postgresql@16
          brew services start redis
          PGBIN="$(brew --prefix postgresql@16)/bin"
          for i in $(seq 1 30); do "$PGBIN/pg_isready" -q && break; sleep 1; done
          "$PGBIN/pg_isready"
          "$PGBIN/psql" -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='pg') THEN CREATE ROLE pg LOGIN SUPERUSER PASSWORD 'password'; END IF; END \$\$;"
          redis-cli ping

      - name: Clone + patch bluesky (pinned)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/bluesky-social/social-app.git /tmp/bluesky
          git -C /tmp/bluesky checkout "$BSKY_SHA"
          # NOTE: the dev-env double-buffer patch is temporarily NOT applied —
          # isolating whether its :3000 L4 proxy is what wedges the composer
          # publish pipeline on CI ("Uploading images..." never clears while
          # the uploadBlob HTTP transaction completes in <100ms). Stock
          # serial mock costs ~3s/flow extra. Re-evaluate after a green run.
          git -C /tmp/bluesky apply --verbose \
            "$GITHUB_WORKSPACE/e2e/bsky/patches/setup-app-release.patch"

      - name: Install dev-env deps + start mock server
        working-directory: /tmp/bluesky/dev-env
        env:
          DB_POSTGRES_URL: postgresql://pg:password@127.0.0.1:5432/postgres
          REDIS_HOST: 127.0.0.1:6379
          # Surface @atproto service (PDS/appview) pino logs in
          # mock-server.log — uploadBlob stalls are otherwise invisible.
          LOG_ENABLED: 'true'
          LOG_LEVEL: 'info'
        run: |
          set -euo pipefail
          # pnpm via npm, not pnpm/action-setup: the action refuses to run
          # because ennio's root package.json pins packageManager to bun.
          npm install -g pnpm@10
          pnpm install
          NODE_ENV=development nohup node ./mock-server.ts > /tmp/mock-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:1986/; then break; fi
            sleep 1
          done
          # Smoke: create users once; proves PDS spin-up + DBs end-to-end.
          RESP=$(curl -fsS -X POST 'http://localhost:1986/?users' --max-time 120)
          echo "$RESP" | grep -q pdsUrl
          echo "mock server healthy"
          # uploadBlob benchmark: the suite's composer flows stall on this
          # exact call ~50% of attempts (app aborts after ~7-20s with no
          # response). Reproduce server-side with curl: auth as alice,
          # upload a small JPEG 5x, print timings.
          PDS=http://localhost:3000
          TOKEN=$(curl -fsS -X POST "$PDS/xrpc/com.atproto.server.createSession" \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"alice.test","password":"hunter2"}' | /usr/bin/python3 -c 'import sys,json;print(json.load(sys.stdin)["accessJwt"])')
          for i in 1 2 3 4 5; do
            /usr/bin/time -p curl -fsS -o /dev/null -X POST "$PDS/xrpc/com.atproto.repo.uploadBlob" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: image/jpeg' \
              --data-binary @"$GITHUB_WORKSPACE/e2e/bsky/fixtures/seed-photo-1.jpg" \
              --max-time 30 2>&1 | grep -E "real|curl" || echo "uploadBlob attempt $i FAILED"
          done

      - name: Cache bsky app fixture
        id: app-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/bskyapp
          key: bsky-app-${{ env.BSKY_APP_ZIP_SHA256 }}

      - name: Download bsky app fixture (cache miss)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/bsky-app.zip "$BSKY_APP_URL"
          echo "${BSKY_APP_ZIP_SHA256}  /tmp/bsky-app.zip" | shasum -a 256 -c -
          unzip -q /tmp/bsky-app.zip -d /tmp/bskyapp
          test -d /tmp/bskyapp/App.app

      - name: Wait for simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="${{ steps.boot.outputs.udid }}"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install bsky app + pre-grant permissions
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" /tmp/bskyapp/App.app
          # Headless runner: no Simulator.app window, so ennioax cannot
          # dismiss permission sheets. Pre-grant everything. simctl grants
          # photos as "limited" (auth_value=3) which still shows a picker
          # prompt — override to full access (auth_value=2) in the sim's
          # TCC database, then kickstart tccd so it re-reads the rows.
          # (Same rows ennio's clearState reinstall path writes.)
          xcrun simctl privacy "$UDID" grant all "$BSKY_BUNDLE_ID" || true
          TCC_DB="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db"
          for svc in kTCCServicePhotoLibrary kTCCServicePhotos kTCCServicePhotosAdd kTCCServiceCamera kTCCServiceMicrophone; do
            sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('$svc', '$BSKY_BUNDLE_ID', 0, 2, 2, 2, 16);"
          done
          xcrun simctl spawn "$UDID" launchctl kickstart -k system/com.apple.tccd || true
          # Photo library: bsky's e2e picker mock grabs an arbitrary JPG out
          # of Media/DCIM/100APPLE (readdir order) and runs it through
          # resize/crop + upload. The runtime's stock photos are large
          # 4288x2848 JPEGs whose decode/resize dies on the virtualized
          # runner (no real GPU) — and photod re-materializes their
          # originals even after they're deleted from DCIM, because its
          # PhotoData db still references them. So rebuild the WHOLE photo
          # library from scratch with only small (<1MB) seeds: wipe DCIM +
          # PhotoData, restart the photo daemons (deleting PhotoData under
          # a live assetsd broke addmedia with PHPhotos 3301), re-seed.
          # compressIfNeeded then short-circuits on size and no heavy image
          # op ever runs. Sequence validated end-to-end on a local iOS 18.5
          # device (both composer flows green).
          SIM_DATA="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data"
          rm -rf "$SIM_DATA/Media/DCIM" "$SIM_DATA/Media/PhotoData"
          xcrun simctl spawn "$UDID" launchctl kill TERM system/com.apple.assetsd || true
          xcrun simctl spawn "$UDID" launchctl kill TERM system/com.apple.photoanalysisd || true
          sleep 8
          # assetsd respawns lazily and can throw PHPhotos 3301 while its
          # fresh library is still initializing on the slow VM — retry.
          # Duplicate imports across attempts are harmless (every seed is
          # the same small JPEG).
          for attempt in 1 2 3 4 5; do
            if xcrun simctl addmedia "$UDID" \
              "$GITHUB_WORKSPACE"/e2e/bsky/fixtures/seed-photo-1.jpg \
              "$GITHUB_WORKSPACE"/e2e/bsky/fixtures/seed-photo-2.jpg \
              "$GITHUB_WORKSPACE"/e2e/bsky/fixtures/seed-photo-3.jpg; then
              echo "addmedia OK on attempt $attempt"; break
            fi
            [ "$attempt" = "5" ] && { echo "addmedia failed after 5 attempts"; exit 1; }
            sleep 8
          done
          # In-sandbox upload source: the app's uploadBlob streams the
          # PICKED FILE PATH directly (small seeds skip compressIfNeeded —
          # and the compress path can't be used as an alternative, its
          # expo-image-manipulator hangs on the GPU-less VM at any image
          # size). A DCIM (out-of-sandbox) source path stalls RN's file
          # read on this runner: CFNetwork opens the connection but the
          # request never reaches the PDS (pino-verified). Replace the
          # DCIM JPEGs with symlinks to a copy inside the app's own data
          # container — listing/size checks are unchanged, but the upload
          # read resolves to an in-sandbox target. The copy lives at the
          # container ROOT, which ennio's per-flow clearState (wiping
          # Documents/Library/tmp contents) leaves untouched.
          # bsky's uploadBlob (withSafeFile) COPIES a sibling .bin next to
          # the picked file before XHR-reading it — a WRITE into the
          # photod-owned DCIM directory. On this runner that write is
          # refused (the upload silently never sends; locally it's
          # tolerated). Open up the directory permissions so the app's
          # sibling-copy lands.
          chmod -R a+rwx "$SIM_DATA/Media" || true
          ls -la "$SIM_DATA/Media/DCIM/100APPLE/"

      - name: Start app log capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          nohup xcrun simctl spawn "$UDID" log stream \
            --predicate 'processImagePath CONTAINS "Bluesky"' \
            --style compact > /tmp/bsky-app.log 2>&1 &

      - name: Run bsky suite
        env:
          ENNIO_UDID: ${{ steps.sim.outputs.udid }}
          ENNIO_DYLIB_PATH: /tmp/ennio-build/libennio.dylib
          ENNIO_CLI: ${{ github.workspace }}/packages/ennio/dist/cli.js
          BLUESKY_DIR: /tmp/bluesky
          SUITE_LOG_DIR: /tmp/bsky-suite-logs
          # GitHub macOS runners are ~1.5-2x slower than a dev Mac for
          # simulator workloads; give visibility waits more headroom.
          ENNIO_DEFAULT_WAIT_MS: '35000'
          # Absorb VM scheduling lag in dismiss->present tap chains (menu
          # item opening a composer) — see hid-driver settleAfterTap.
          ENNIO_PRESENT_GRACE_MS: '800'
          # Hold the flow after publish/submit/send taps until the
          # presenting sheet actually dismisses — uploads take seconds on
          # the VM and the next step otherwise cancels them mid-flight
          # (composer wedged in "Uploading images..."). See runner/tap.ts.
          ENNIO_SUBMIT_DISMISS_MAX_MS: '20000'
          # Iteration aid: composer-only on push while the composer flows
          # are the last red ones; full suite via workflow_dispatch (or
          # clear this default before merge).
          FLOW_FILTER: ${{ inputs.flow_filter || 'composer' }}
        run: bash e2e/bsky/run-suite.sh

      - name: Mock server log + DCIM state (always)
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          tail -50 /tmp/mock-server.log || true
          echo "--- DCIM after suite (did photod resurrect stock files?) ---"
          ls -la "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Media/DCIM/100APPLE/" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bsky-suite-logs
          path: |
            /tmp/bsky-suite-logs/
            /tmp/ennio-shots/
            /tmp/mock-server.log
            /tmp/bsky-app.log
          retention-days: 7
          if-no-files-found: warn
