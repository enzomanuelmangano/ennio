# Example-app e2e — full maestro-e2e suite against a prebuilt fixture.
#
# The suite tests the RUNNER, not the app, so the app binary is a stable
# fixture published as a GitHub release asset (e2e-fixtures-v1) instead
# of a per-run xcodebuild — same pattern as ci-wikipedia. The full
# from-source path (expo prebuild + pod install + xcodebuild) stays in
# ci-fast-build for when the example app itself changes.
#
# Cost: $0 — public repo, standard GitHub-hosted runner.
#
# Security posture (mirrors ci-wikipedia):
#   - permissions: contents: read
#   - actions pinned to full commit SHAs
#   - checkout with persist-credentials: false
#   - fixture download SHA-256-verified against a pinned hash before
#     anything is unzipped or installed
#   - no secrets consumed
#
# Triggers: pull_request (paths-filtered) + manual dispatch —
#   gh workflow run ci-example.yml
name: ci-example

on:
  workflow_dispatch:
    inputs:
      in_process_tap:
        description: 'Run with --in-process-tap (in-process activation, HID fallback)'
        type: boolean
        default: false
      no_animations:
        description: 'Run with --disable-animations (suppress app animations)'
        type: boolean
        default: false
      disable_reuse_app:
        description: 'Run with --disable-reuse-app (full relaunch; reuse is on by default)'
        type: boolean
        default: false
  # Every PR that can affect the iOS runner or the example suite.
  #
  # src/** is the shared cross-platform CLI (runner, settle, rpc, driver
  # core) — a change there genuinely affects iOS, so it triggers here.
  # The Android-only TS below is carved out with negations (last-match-
  # wins, per file): a PR touching ONLY Android-specific TS won't boot a
  # macOS sim. android/** native isn't listed at all, so it never does.
  pull_request:
    branches: [main]
    paths:
      - 'packages/ennio/src/**'
      - '!packages/ennio/src/cli/android/**'
      - '!packages/ennio/src/cli/platform/android.ts'
      - '!packages/ennio/src/cli/driver/android-driver.ts'
      - 'packages/ennio/ios/**'
      - 'packages/ennio/cpp/**'
      - 'packages/ennio/native-hid/**'
      - 'packages/ennio/native-ax/**'
      - 'packages/ennio/native-shim/**'
      - 'example/maestro-e2e/**'
      - 'e2e/conformance/**'
      - '.github/workflows/ci-example.yml'

permissions:
  contents: read

concurrency:
  group: example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of EnnioExample-app.zip from the e2e-fixtures-v1 release.
  # Refresh procedure documented in that release's notes.
  EXAMPLE_APP_ZIP_SHA256: a35c43c6ae36f44037f123c38260f24c2a5c9b1eb43610a11f3fb19a8e9d3998
  EXAMPLE_APP_URL: https://github.com/enzomanuelmangano/ennio/releases/download/e2e-fixtures-v1/EnnioExample-app.zip

jobs:
  # Cheap pre-flight on a Linux runner: don't boot a simulator/emulator
  # for a PR that can't even lint, typecheck, format, or build. The
  # expensive job below only starts once this passes.
  gate:
    name: Fast checks gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build

  example:
    name: Example suite (iOS sim, prebuilt fixture)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.app

      # Boot the sim NOW (the command blocks ~60s) so it spends the next
      # ~4-5 min of JS/dylib setup settling — SpringBoard, launchd_sim,
      # CoreSimulator services. The later "Wait for simulator" step then
      # confirms in seconds. Do NOT background this: a backgrounded boot
      # is killed at step end, the Wait step's `bootstatus -b` then boots
      # the device itself, and the suite starts against a just-booted,
      # unsettled sim — measured: the first `simctl terminate` blocked
      # 7.5 minutes.
      - name: Boot simulator (early)
        run: xcrun simctl boot "iPhone 17 Pro" || xcrun simctl boot "iPhone 16 Pro" || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.19

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build ennio CLI
        working-directory: packages/ennio
        run: bun run build

      - name: Build dylib + HID helper
        working-directory: packages/ennio
        run: |
          set -euo pipefail
          bash scripts/build-dylib-local.sh
          bash scripts/build-hid-helper.sh

      - name: Cache example app fixture
        id: app-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/exampleapp
          key: example-app-${{ env.EXAMPLE_APP_ZIP_SHA256 }}

      - name: Download example app fixture (cache miss)
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/EnnioExample-app.zip "$EXAMPLE_APP_URL"
          echo "${EXAMPLE_APP_ZIP_SHA256}  /tmp/EnnioExample-app.zip" | shasum -a 256 -c -
          unzip -q /tmp/EnnioExample-app.zip -d /tmp/exampleapp
          test -d /tmp/exampleapp/EnnioExample.app

      - name: Wait for simulator
        id: sim
        run: |
          set -euo pipefail
          # The boot was kicked off in the background minutes ago; by now
          # it's usually done. Bounded poll covers the race where it
          # hasn't registered as booting yet (bootstatus would error out).
          for i in $(seq 1 24); do
            if xcrun simctl bootstatus booted -b 2>/dev/null; then break; fi
            sleep 5
          done
          UDID=$(xcrun simctl list devices booted | awk -F '[()]' '/Booted/ {print $2; exit}')
          test -n "$UDID" || { echo "No sim booted"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Pre-warm CoreSimulator's spawn/cfprefsd path in the background:
          # the FIRST `simctl spawn` after boot pays a ~60-90s service
          # warm-up on these runners (measured via ENNIO_PHASE_TRACE —
          # enableAccessibility 77s). Poking it now, overlapped with the
          # app install below, moves that cost off the first flow.
          (xcrun simctl spawn "$UDID" defaults read com.apple.Accessibility >/dev/null 2>&1 || true) &

      - name: Install example app
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" /tmp/exampleapp/EnnioExample.app

      - name: Run example suite
        env:
          ENNIO_UDID: ${{ steps.sim.outputs.udid }}
          ENNIO_DYLIB_PATH: /tmp/ennio-build/libennio.dylib
          ENNIO_FAST_FLAG: ${{ inputs.in_process_tap && '--in-process-tap' || '' }}
          ENNIO_NOANIM_FLAG: ${{ inputs.no_animations && '--disable-animations' || '' }}
          ENNIO_REUSE_FLAG: ${{ inputs.disable_reuse_app && '--disable-reuse-app' || '' }}
          # GitHub Actions macos runners are ~1.5-2× slower than a dev Mac
          # for simulator workloads. Give assertVisible / waitFor more headroom
          # so slow dark-mode re-renders and logout navigations don't timeout.
          ENNIO_DEFAULT_WAIT_MS: '25000'
          # Per-phase timing ([phase] lines in the per-flow logs) — costs
          # nothing, makes runner slowness diagnosable from artifacts.
          ENNIO_PHASE_TRACE: '1'
        run: |
          set -uo pipefail
          mkdir -p /tmp/ennio-logs
          FLAGS="$ENNIO_FAST_FLAG $ENNIO_NOANIM_FLAG $ENNIO_REUSE_FLAG"
          echo "mode:${FLAGS:- hid}"
          # SINGLE DAEMON: one ennio process drives ALL flows (same model as the
          # react-nav suite), instead of a fresh node per flow. clearState
          # soft-resets the app in-process between flows, so state isolation
          # holds; what the per-flow loop paid for nothing was node/CLI
          # cold-start every flow. Pass the EXPLICIT top-level flow list (NOT the
          # directory — a dir glob would pull in subflows/ + conformance/). The
          # runner streams the full per-step output live (verbose), so CI logs
          # show every flow's steps; --fail-fast stops at the first failing flow.
          mapfile -t FILES < <(ls example/maestro-e2e/*.yaml | grep -vE '/(_|00-)')
          echo "flows: ${#FILES[@]}"
          node packages/ennio/dist/cli.js test "${FILES[@]}" --verbose --fail-fast $FLAGS \
            2>&1 | tee /tmp/ennio-logs/suite.log
          RC=${PIPESTATUS[0]}
          echo ""
          echo "Example suite: rc=$RC"
          exit $RC

      # NOTE: the Maestro conformance suite (e2e/conformance/) is NOT gated in
      # CI. Its per-row fixtures assert on example-app screens (g-playground,
      # toggle-1..5) that aren't in the published fixture yet, and several rows
      # encoded the maestro-parity anchoring we've since dropped (single
      # resilient profile). The suite stays in the repo to revisit once the
      # fixture grows those screens; re-add a gated step here then.

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-logs
          path: |
            /tmp/ennio-logs/
            /tmp/ennio-conf-maestro/
            /tmp/ennio-conf-resilient/
            /tmp/ennio-shots/
          retention-days: 7
          if-no-files-found: warn
