# Build, smoke-test, and publish ennio's prebuilt dylib slices.
#
# The CLI ships per-RN-version dynamic libraries that get DYLD_INSERT_LIBRARIES'd
# into the user's app at simctl launch time — that's the zero-install path.
# This workflow is the production pipeline that produces those slices.
#
# Triggers:
#   - workflow_dispatch (manual rebuild from main, no publish)
#   - push: tags 'v*' (release: builds + smokes + publishes to npm w/ provenance)
#
# Matrix is intentionally narrow: support window is the most recent ~3 RN
# minors. Drop the oldest when a new one is added; users on out-of-matrix
# RN versions fall back to the local `scripts/build-dylib.sh` path the CLI
# logs in verbose mode.
name: build-dylibs

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-shim:
    name: Build shim (RN-agnostic)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build shim
        run: bash packages/ennio/scripts/build-shim.sh
      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-shim
          path: packages/ennio/prebuilt/libennio-shim.dylib
          if-no-files-found: error
          retention-days: 7

  build-slice:
    name: Build slice (RN ${{ matrix.rn }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        rn: ['0.81.5', '0.82.1', '0.83.6']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      # Pin Xcode. Sliced dylibs are sensitive to the Xcode/clang ABI;
      # drifting silently between minor Xcode versions has burned us
      # before. Bump deliberately in a separate PR.
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.app

      # Scaffold a throwaway Expo+RN@<rn> app, install ennio as a local
      # pod via npm link, prebuild + xcodebuild EnnioCore. The .o files
      # land in DerivedData where build-dylib.sh can pick them up.
      - name: Scaffold scratch app + build EnnioCore
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/scratch
          cd /tmp/scratch
          npx --yes create-expo-app . --template blank-typescript --no-install
          # Pin RN. Expo picks a default; we override to test ABI.
          npm pkg set "dependencies.react-native=$RN_VERSION"
          npm pkg set "dependencies.react-native-nitro-modules=^0.35.5"
          npm pkg set "dependencies.@reactiive/ennio=file:$GITHUB_WORKSPACE/packages/ennio"
          npm pkg set "devDependencies.@reactiive/ennio-expo-plugin=file:$GITHUB_WORKSPACE/packages/ennio-expo-plugin"
          npm install --legacy-peer-deps --no-audit --no-fund
          # Wire the expo plugin into app.json (CI scaffold has app.json,
          # not app.config.ts).
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json'));
            j.expo.plugins = (j.expo.plugins||[]).concat(['@reactiive/ennio-expo-plugin']);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          "
          npx expo prebuild --platform ios --clean
          cd ios
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "$(node -e "console.log(require('../app.json').expo.name)")" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/scratch-dd \
            build

      - name: Locate EnnioCore object directory
        id: locate
        run: |
          OBJ=$(find /tmp/scratch-dd -type d -path '*EnnioCore.build/Objects-normal/arm64' | head -n1)
          echo "Found objects at $OBJ"
          echo "obj_dir=$OBJ" >> "$GITHUB_OUTPUT"

      - name: Link dylib
        env:
          ENNIO_OBJECTS_DIR: ${{ steps.locate.outputs.obj_dir }}
        run: bash packages/ennio/scripts/build-dylib.sh ${{ matrix.rn }}

      # Symbol-surface diff: any new external symbol vs the checked-in
      # allowlist requires explicit PR approval. Catches a malicious
      # patch that introduces a network library or arbitrary syscalls.
      - name: Symbol-surface diff
        run: |
          DYLIB="packages/ennio/prebuilt/libennio-rn${{ matrix.rn }}-sim.dylib"
          ALLOW="packages/ennio/native-shim/expected-symbols.txt"
          if [ -f "$ALLOW" ]; then
            nm -gU "$DYLIB" | awk '{print $3}' | sort -u > /tmp/actual-symbols.txt
            diff -u "$ALLOW" /tmp/actual-symbols.txt || {
              echo "::error::dylib symbol surface drifted from allowlist. Review the diff above; if intentional, update native-shim/expected-symbols.txt."
              exit 1
            }
          fi

      # Smoke: boot a sim, install the scratch app, drive it via the CLI
      # injecting THIS slice. Catches ABI drift before the artifact
      # leaves CI.
      - name: Smoke (boot sim + run a flow)
        timeout-minutes: 10
        run: |
          xcrun simctl boot "iPhone 17 Pro" || true
          UDID=$(xcrun simctl list devices booted | awk -F '[()]' '/Booted/ {print $2; exit}')
          xcrun simctl install "$UDID" /tmp/scratch-dd/Build/Products/Debug-iphonesimulator/*.app
          # Add a maestro smoke flow at the scratch app root that
          # asserts the JSI binding is present via __ennioDispatch.
          mkdir -p /tmp/scratch/.maestro
          cat > /tmp/scratch/.maestro/smoke.yaml <<'YAML'
          appId: $APP_ID
          ---
          - launchApp
          - evalScript: |
              if (typeof __ennioDispatch !== 'function') {
                throw new Error('__ennioDispatch missing — dylib failed to install');
              }
          YAML
          cd /tmp/scratch
          # Boot Metro in background so dev-client deeplink works.
          npx expo start --port 8081 &
          # Give Metro time to come up.
          sleep 10
          APP_BUNDLE=$(plutil -extract CFBundleIdentifier raw /tmp/scratch-dd/Build/Products/Debug-iphonesimulator/*.app/Info.plist)
          sed -i '' "s/\$APP_ID/$APP_BUNDLE/" .maestro/smoke.yaml
          npx ennio test .maestro/smoke.yaml

      - name: Upload slice artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-slice-${{ matrix.rn }}
          path: packages/ennio/prebuilt/libennio-rn${{ matrix.rn }}-sim.dylib
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm with provenance
    needs: [build-shim, build-slice]
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    # `id-token: write` is required for npm provenance (Sigstore).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download shim
        uses: actions/download-artifact@v4
        with:
          name: dylib-shim
          path: packages/ennio/prebuilt
      - name: Download slices
        uses: actions/download-artifact@v4
        with:
          pattern: dylib-slice-*
          path: packages/ennio/prebuilt
          merge-multiple: true

      - name: Regenerate manifest from downloaded artifacts
        run: bash packages/ennio/scripts/regen-manifest.sh

      - name: Build CLI
        working-directory: packages/ennio
        run: bun install --frozen-lockfile && bun run build

      - name: npm publish (with provenance)
        working-directory: packages/ennio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Attach dylibs to GH Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/ennio/prebuilt/libennio-shim.dylib
            packages/ennio/prebuilt/libennio-rn*-sim.dylib
            packages/ennio/prebuilt/manifest.json
