# Build, smoke-test, and publish ennio's prebuilt dylib.
#
# The CLI ships a universal dynamic library that gets
# DYLD_INSERT_LIBRARIES'd into the user's app at simctl launch time.
# The dylib uses -undefined dynamic_lookup so React Native symbols
# resolve from the host process at load time — one binary, every
# New Architecture RN version.
#
# Triggers:
#   - workflow_dispatch (manual rebuild from main, no publish)
#   - push: tags 'v*' (release: builds + smokes + publishes to npm)
#
# Auth: publish uses npm OIDC Trusted Publishing — NO long-lived
# NPM_TOKEN. GitHub mints a short-lived signed identity token (the
# `id-token: write` permission); npm verifies GitHub's signature and
# matches it against the trusted-publisher config registered for
# @reactiive/ennio (repo + this workflow file). Provenance is generated
# automatically from the same identity.
#
# One-time npmjs.com setup: @reactiive/ennio -> Settings -> Trusted Publisher
# -> add a GitHub Actions publisher (repo enzomanuelmangano/ennio, workflow
# build-dylibs.yml, environment release). Until that exists, publish 403s.
#
# Every third-party action is pinned to a full commit SHA so a hijacked tag
# can't inject code into the job that holds the OIDC grant.
name: build-dylibs

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-shim:
    name: Build shim (RN-agnostic)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.app
      - name: Build shim
        run: bash packages/ennio/scripts/build-shim.sh
      - name: Upload shim artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dylib-shim
          path: packages/ennio/prebuilt/libennio-shim.dylib
          if-no-files-found: error
          retention-days: 7

  build-hid:
    name: Build enniohid helper (in-house HID)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.app
      - name: Build enniohid
        run: |
          bash packages/ennio/scripts/build-hid-helper.sh
          cp /tmp/ennio-build/enniohid packages/ennio/prebuilt/enniohid
      - name: Upload enniohid artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hid-helper
          path: packages/ennio/prebuilt/enniohid
          if-no-files-found: error
          retention-days: 7

  build-dylib:
    name: Build universal dylib
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pin Xcode. The dylib is sensitive to the Xcode/clang ABI;
      # drifting silently between minor Xcode versions has burned us
      # before. Bump deliberately in a separate PR.
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.app

      - name: Compile EnnioCore + link dylib
        run: |
          set -euxo pipefail
          ENNIO=$GITHUB_WORKSPACE/packages/ennio
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          OBJ_DIR=/tmp/ennio-obj
          mkdir -p "$OBJ_DIR"
          CFLAGS="-arch arm64 -isysroot $SDK -std=c++17 -fobjc-arc -fmodules \
            -target arm64-apple-ios17.0-simulator \
            -I$ENNIO/cpp -I$ENNIO/ios/bootstrap -I$ENNIO/ios/finders \
            -I$ENNIO/ios/handlers -I$ENNIO/ios/observers -I$ENNIO/ios/ops \
            -I$ENNIO/ios/PrivateAPI -O2"
          for f in $ENNIO/cpp/*.cpp; do
            xcrun clang++ $CFLAGS -c "$f" -o "$OBJ_DIR/$(basename "$f" .cpp).o"
          done
          for f in $ENNIO/ios/**/*.mm; do
            xcrun clang++ $CFLAGS -c "$f" -o "$OBJ_DIR/$(basename "$f" .mm).o"
          done
          ENNIO_OBJECTS_DIR="$OBJ_DIR" bash "$ENNIO/scripts/build-dylib.sh"

      # Symbol-surface diff: any new external symbol vs the checked-in
      # allowlist requires explicit PR approval. Catches a malicious
      # patch that introduces a network library or arbitrary syscalls.
      - name: Symbol-surface diff
        run: |
          DYLIB="packages/ennio/prebuilt/libennio.dylib"
          ALLOW="packages/ennio/native-shim/expected-symbols.txt"
          if [ -f "$ALLOW" ]; then
            nm -gU "$DYLIB" | awk '{print $3}' | sort -u > /tmp/actual-symbols.txt
            diff -u "$ALLOW" /tmp/actual-symbols.txt || {
              echo "::error::dylib symbol surface drifted from allowlist. Review the diff above; if intentional, update native-shim/expected-symbols.txt."
              exit 1
            }
          else
            echo "::warning::native-shim/expected-symbols.txt missing; skipping symbol-surface check."
          fi

      - name: Upload dylib artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dylib-main
          path: packages/ennio/prebuilt/libennio.dylib
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm (OIDC trusted publishing)
    needs: [build-shim, build-dylib, build-hid]
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    # `release` is a protected GitHub Environment: it requires a manual
    # approval (reviewer) before this job runs, so a pushed tag alone never
    # publishes unattended. Reviewers are configured in repo Settings ->
    # Environments -> release.
    environment: release
    # `id-token: write` lets the runner request the OIDC identity token npm
    # verifies. `contents: read` is all the checkout needs. No token secret
    # is referenced anywhere in this job.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download shim
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dylib-shim
          path: packages/ennio/prebuilt
      - name: Download dylib
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dylib-main
          path: packages/ennio/prebuilt
      - name: Download enniohid
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hid-helper
          path: packages/ennio/prebuilt
      - name: Restore enniohid exec bit
        # upload/download-artifact does not preserve file modes.
        run: chmod +x packages/ennio/prebuilt/enniohid

      - name: Regenerate manifest from downloaded artifacts
        run: bash packages/ennio/scripts/regen-manifest.sh

      - name: Build CLI
        working-directory: packages/ennio
        run: bun install --frozen-lockfile && bun run build

      - name: npm publish (OIDC + provenance)
        working-directory: packages/ennio
        run: |
          # OIDC Trusted Publishing requires npm >= 11.5.0. The Node 22
          # toolchain ships an older npm, so upgrade in-job. No NODE_AUTH_TOKEN:
          # `npm publish` performs the OIDC handshake itself when a trusted
          # publisher is configured for this package, and emits provenance
          # from the same identity.
          npm install -g npm@latest
          npm --version
          # Route prerelease versions (0.0.7-beta.0, -rc.1, …) to the
          # `beta` dist-tag so they never clobber `latest`. Plain versions
          # go to `latest`. npm does NOT auto-route prereleases.
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG=beta ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "Publishing $VERSION to dist-tag: $DIST_TAG"
          npm publish --provenance --access public --tag "$DIST_TAG"
