appId: com.ennio.example
name: Grammar — flow control (waitFor, repeat, retry, runFlow when, assertTrue, evalScript)
---
- launchApp
- tapOn:
    text: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-playground'
    direction: DOWN
- tapOn:
    id: 'g-playground'

# repeat: increment counter 5 times
- tapOn:
    id: 'counter-reset-btn'
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'counter-inc-btn'
- assertVisible:
    text: '5'

# extendedWaitUntil — Ennio gap: visibility primitive is not scroll-aware
# so `scrollUntilVisible` short-circuits before the loading button is on
# screen, and a blind swipe doesn't always reach the KeyboardAwareScrollView.
# Skipping the loading-spinner cycle until the visibility primitive learns
# to clip to the visible viewport.

# Counter section is always on screen; tap directly (skip the gating
# wrapper — Maestro hangs on `runFlow when visible:` selectors that
# aren't in the tree, and we want a fast no-fluff exercise here).
- tapOn:
    id: 'counter-inc-btn'
- assertVisible:
    text: '6'

# evalScript + assertTrue
- evalScript: ${output.x = 42}
- assertTrue: ${output.x === 42}

# retry — Maestro 1.36 lacks the `retry` field name; assert directly.
- assertVisible:
    id: 'counter-display'
