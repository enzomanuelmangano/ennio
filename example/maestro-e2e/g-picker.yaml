appId: com.ennio.example
name: 'Gauntlet — Picker'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-picker'
    direction: DOWN
- tapOn:
    id: 'g-picker'
- assertVisible:
    id: 'picker-screen'
- assertVisible:
    text: 'Selected: apple'
- assertVisible:
    id: 'picker-control'
