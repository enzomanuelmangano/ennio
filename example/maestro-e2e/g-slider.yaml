appId: com.ennio.example
name: "Gauntlet — Slider"
---
- launchApp:
    clearState: true
- tapOn: "Gauntlet"
- scrollUntilVisible:
    element:
      id: "g-slider"
    direction: DOWN
- tapOn:
    id: "g-slider"
- assertVisible:
    id: "slider-screen"
- assertVisible:
    id: "slider-value"
- tapOn:
    id: "slider-set-half"
- assertVisible:
    text: "0.50"
