appId: com.tasto.example
name: "Debug Minimal"
---
# Login first
- tapOn:
    text: "Home"
- assertVisible:
    id: "home-signin-btn"
    timeout: 3000
- tapOn:
    id: "home-signin-btn"
- assertVisible:
    id: "login-screen"
    timeout: 3000
- tapOn:
    id: "demo-login-btn"
- assertVisible:
    id: "home-screen"
    timeout: 5000

# Now do the same typetext steps
- tapOn:
    text: "Products"
- assertVisible:
    id: "products-screen"
    timeout: 3000
- tapOn:
    id: "search-input"
- inputText: "Wireless"
- assertVisible:
    text: "Wireless"
    timeout: 3000
