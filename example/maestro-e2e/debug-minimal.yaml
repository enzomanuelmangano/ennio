appId: com.ennio.example
name: 'Debug Minimal'
---
# Login first
- tapOn:
    text: 'Home'
- assertVisible:
    id: 'home-signin-btn'
- tapOn:
    id: 'home-signin-btn'
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'demo-login-btn'
- assertVisible:
    id: 'home-screen'

# Now do the same typetext steps
- tapOn:
    text: 'Products'
- assertVisible:
    id: 'products-screen'
- tapOn:
    id: 'search-input'
- inputText: 'Wireless'
- assertVisible:
    text: 'Wireless'
