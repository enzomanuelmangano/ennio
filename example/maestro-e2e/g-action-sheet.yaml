appId: com.ennio.example
name: "Gauntlet — Action sheet"
---
- launchApp:
    clearState: true
- tapOn: "Gauntlet"
- scrollUntilVisible:
    element:
      id: "g-action-sheet"
    direction: DOWN
- tapOn:
    id: "g-action-sheet"
- assertVisible:
    id: "action-sheet-screen"
- tapOn:
    id: "action-sheet-open"
- tapOn: "Save"
- assertVisible:
    text: "Save"
