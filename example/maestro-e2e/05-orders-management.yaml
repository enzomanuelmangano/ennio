# Test: Orders Management Flow
# Tests order history, order details, tracking

appId: com.ennio.example
name: 'Orders Management'
tags:
  - orders
  - auth-required

---
- launchApp:
    clearState: true

# ============================================
# SETUP: Login with demo account
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: 'home-signin-btn'
- tapOn:
    id: 'demo-login-btn'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'demo-login-btn'
- assertVisible:
    id: 'home-screen'

# ============================================
# TEST: Navigate to orders via quick action
# ============================================

- tapOn:
    id: 'quick-action-orders'

- assertVisible:
    id: 'orders-screen'

# ============================================
# TEST: Orders list or empty state
# ============================================

# Empty state assertions — fresh demo user has no orders.
- assertVisible:
    text: 'No orders yet'
- assertVisible:
    id: 'browse-products'

# ============================================
# TEST: Navigate to orders via profile menu
# ============================================

# Pop the Stack-pushed orders screen so the tab bar is reachable again.
- back

- tapOn:
    text: 'Profile'

- assertVisible:
    id: 'profile-screen'

- tapOn:
    id: 'menu-orders'

- assertVisible:
    id: 'orders-screen'

# ============================================
# TEST: Create an order for testing (if needed)
# ============================================

# Create a test order so subsequent assertions have something to look at.
- runFlow:
    file: subflows/create-test-order.yaml

# Orders list now populated.
- assertVisible:
    id: 'orders-list'

# View order details.
- tapOn:
    text: 'Processing'
- assertVisible:
    id: 'order-details'
- assertVisible:
    text: 'Shipping'
- tapOn:
    id: 'close-details'
- assertVisible:
    id: 'orders-screen'

# ============================================
# TEST: Guest user orders view
# ============================================

# Logout first - pop the Stack-pushed orders screen so the tab bar is reachable.
- back
- tapOn:
    text: 'Profile'
- assertVisible:
    id: 'profile-screen'
- scrollUntilVisible:
    element:
      id: 'menu-logout'
    direction: DOWN
- tapOn:
    id: 'menu-logout'
- tapOn:
    text: 'Sign Out'

# Try to access orders
- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: 'quick-action-orders'

# Should show guest view
- assertVisible:
    id: 'orders-guest'

- assertVisible:
    text: 'Sign in to view orders'

- assertVisible:
    id: 'sign-in-btn'

# ============================================
# TEST: Sign in from orders guest view
# ============================================

- tapOn:
    id: 'sign-in-btn'

- assertVisible:
    id: 'login-screen'

# Login with demo
- tapOn:
    id: 'demo-login-btn'

# Should return to orders
- assertVisible:
    id: 'orders-screen'
