# Test: Cart Management Flow
# Tests add/remove items, quantity updates, cart summary

appId: com.ennio.example
name: 'Cart Management'
tags:
  - cart
  - critical

---
- launchApp:
    clearState: true

# ============================================
# SETUP: Clear any existing cart items
# ============================================

- runFlow:
    file: subflows/navigate-cart.yaml

# Cart is empty after clearState; no cleanup needed.

# ============================================
# TEST: Empty cart state
# ============================================

- assertVisible:
    id: 'cart-screen-empty'

- assertVisible:
    text: 'Your cart is empty'

- assertVisible:
    id: 'browse-products-btn'

# ============================================
# TEST: Navigate to products from empty cart
# ============================================

- tapOn:
    id: 'browse-products-btn'

- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Add product to cart from products list
# ============================================

- tapOn:
    id: 'add-to-cart-1'

# Cart badge should update (if visible)
# Navigate to cart to verify
- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-screen'

- assertVisible:
    id: 'cart-item-1'

# ============================================
# TEST: Add product from product detail
# ============================================

- runFlow:
    file: subflows/navigate-products.yaml

# Sort + filter put Smart Watch Pro (`product-card-2`) below the
# fold; scroll until it's in view before tapping.
- scrollUntilVisible:
    element:
      id: 'product-card-2'
    direction: DOWN
- tapOn:
    id: 'product-card-2'

- assertVisible:
    id: 'product-detail-screen'

# Increase quantity before adding
- tapOn:
    id: 'increase-quantity'
- tapOn:
    id: 'increase-quantity'

- tapOn:
    id: 'add-to-cart-btn'

# Handle alert
- assertVisible:
    text: 'Added to Cart'
- tapOn:
    text: 'View Cart'

# ============================================
# TEST: Cart has multiple items
# ============================================

- assertVisible:
    id: 'cart-screen'

- assertVisible:
    id: 'cart-item-1'
- assertVisible:
    id: 'cart-item-2'

# ============================================
# TEST: Update quantity in cart
# ============================================

# Increase quantity of first item
- tapOn:
    id: 'increase-qty-1'

# Verify quantity updated
- assertVisible:
    id: 'qty-1'

# Decrease quantity
- tapOn:
    id: 'decrease-qty-1'

# ============================================
# TEST: Cart summary updates
# ============================================

- assertVisible:
    id: 'cart-summary'
- assertVisible:
    id: 'cart-total'

# ============================================
# TEST: Remove single item
# ============================================

- tapOn:
    id: 'remove-item-2'

# Item 2 should be gone
- assertNotVisible:
    id: 'cart-item-2'

# Item 1 should still be there
- assertVisible:
    id: 'cart-item-1'

# ============================================
# TEST: Add more items from home featured
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- scrollUntilVisible:
    element:
      id: 'featured-product-1'
    direction: UP

# Featured carousel is a horizontal ScrollView nested under the home
# vertical ScrollView. Maestro's scrollUntilVisible LEFT can't always
# pick the right scroller (it picks the outer one and finds nothing
# horizontal there); a couple of explicit LEFT swipes on the carousel
# reliably advance it to product-3.
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- tapOn:
    id: 'add-to-cart-featured-3'

# Navigate back to cart
- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-item-3'

# ============================================
# TEST: Clear entire cart
# ============================================

- tapOn:
    id: 'clear-cart-btn'

# Confirm clear
- assertVisible:
    text: 'Clear Cart'
- tapOn:
    text: 'Clear'

# Should show empty state
- assertVisible:
    id: 'cart-screen-empty'

# ============================================
# TEST: Add from trending products
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Scroll to trending section
- scrollUntilVisible:
    element:
      id: 'trending-product-4'
    direction: DOWN

- tapOn:
    id: 'trending-product-4'

- assertVisible:
    id: 'product-detail-screen'

- tapOn:
    id: 'add-to-cart-btn'

- tapOn:
    text: 'View Cart'

- scrollUntilVisible:
    element:
      id: 'cart-item-4'

- assertVisible:
    id: 'cart-item-4'

# ============================================
# TEST: Checkout button visible
# ============================================

- assertVisible:
    id: 'checkout-btn'
