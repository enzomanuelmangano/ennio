# Test: Cart Management Flow
# Tests add/remove items, quantity updates, cart summary

appId: com.ennio.example
name: 'Cart Management'
tags:
  - cart
  - critical

---
- launchApp:
    clearState: true

# ============================================
# SETUP: Clear any existing cart items
# ============================================

- runFlow:
    file: subflows/navigate-cart.yaml

# Cart is empty after clearState; no cleanup needed.

# ============================================
# TEST: Empty cart state
# ============================================

- assertVisible:
    id: 'cart-screen-empty'

- assertVisible:
    text: 'Your cart is empty'

- assertVisible:
    id: 'browse-products-btn'

# ============================================
# TEST: Navigate to products from empty cart
# ============================================

- tapOn:
    id: 'browse-products-btn'

- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Add product to cart from products list
# ============================================

- tapOn:
    id: 'add-to-cart-1'

# Cart badge should update (if visible)
# Navigate to cart to verify
- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-screen'

- assertVisible:
    id: 'cart-item-1'

# ============================================
# TEST: Add product from product detail
# ============================================

- runFlow:
    file: subflows/navigate-products.yaml

# Sort + filter put Smart Watch Pro (`product-card-2`) below the
# fold; scroll until it's in view before tapping.
- scrollUntilVisible:
    element:
      id: 'product-card-2'
    direction: DOWN
- tapOn:
    id: 'product-card-2'

- assertVisible:
    id: 'product-detail-screen'

# Increase quantity before adding
- tapOn:
    id: 'increase-quantity'
- tapOn:
    id: 'increase-quantity'

- tapOn:
    id: 'add-to-cart-btn'

# Handle alert
- assertVisible:
    text: 'Added to Cart'
- tapOn:
    text: 'View Cart'

# ============================================
# TEST: Cart has multiple items
# ============================================

- assertVisible:
    id: 'cart-screen'

- assertVisible:
    id: 'cart-item-1'
- assertVisible:
    id: 'cart-item-2'

# ============================================
# TEST: Update quantity in cart
# ============================================

# Increase quantity of first item
- tapOn:
    id: 'increase-qty-1'

# Verify quantity updated
- assertVisible:
    id: 'qty-1'

# Decrease quantity
- tapOn:
    id: 'decrease-qty-1'

# ============================================
# TEST: Cart summary updates
# ============================================

- assertVisible:
    id: 'cart-summary'
- assertVisible:
    id: 'cart-total'

# ============================================
# TEST: Remove single item
# ============================================

# Remove the FIRST item, not the last. The cart is a scrollable FlatList
# of items above a FIXED footer (summary + checkout) whose own height the
# list can't scroll past — so the LAST item's action row (with its remove
# button) renders pinned at the list/footer boundary and on the x86 CI
# emulator parked clipped behind the footer (remove-item-2 → "element not
# found", and scrolling can't free it). remove-item-1 sits at the top of
# the list, always fully on-screen, so the remove behaviour is exercised
# identically without the boundary-occlusion flake.
- tapOn:
    id: 'remove-item-1'

# Item 1 should be gone
- assertNotVisible:
    id: 'cart-item-1'

# Item 2 should still be there
- assertVisible:
    id: 'cart-item-2'

# ============================================
# TEST: Add more items from home featured
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Advance the featured carousel (a horizontal ScrollView nested under
# the home page's vertical scrollview). Both Maestro and Ennio's
# `scrollUntilVisible LEFT` pick the OUTER scroller on a page like
# this and the inner carousel never moves. Use explicit percentage-
# coordinate swipes anchored at the carousel's y-band (~55% screen
# height) — pure Maestro spec, both runners execute identically.
- swipe:
    start: 90%,55%
    end: 10%,55%
# Let the horizontal carousel's momentum glide settle before tapping —
# otherwise the small "+" button is still moving when its position is
# measured and the tap lands on the card image behind it (which pushes
# the product detail instead of adding to cart).
- waitForAnimationToEnd
- tapOn:
    id: 'add-to-cart-featured-3'

# Navigate back to cart
- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-item-3'

# ============================================
# TEST: Clear entire cart
# ============================================

- tapOn:
    id: 'clear-cart-btn'

# Confirm clear
- assertVisible:
    text: 'Clear Cart'
- tapOn:
    text: 'Clear'

# Should show empty state
- assertVisible:
    id: 'cart-screen-empty'

# ============================================
# TEST: Add from trending products
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Scroll to trending section
- scrollUntilVisible:
    element:
      id: 'trending-product-4'
    direction: DOWN

- tapOn:
    id: 'trending-product-4'

- assertVisible:
    id: 'product-detail-screen'

- tapOn:
    id: 'add-to-cart-btn'

- tapOn:
    text: 'View Cart'

- scrollUntilVisible:
    element:
      id: 'cart-item-4'

- assertVisible:
    id: 'cart-item-4'

# ============================================
# TEST: Checkout button visible
# ============================================

- assertVisible:
    id: 'checkout-btn'
