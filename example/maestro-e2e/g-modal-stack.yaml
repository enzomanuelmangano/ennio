appId: com.ennio.example
name: 'Gauntlet — Modal stacking'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-modal-stack'
    direction: DOWN
- tapOn:
    id: 'g-modal-stack'
- assertVisible:
    id: 'modal-stack-screen'

- tapOn:
    id: 'modal-open-first'
- assertVisible:
    id: 'modal-1-body'

- tapOn:
    id: 'modal-open-second'
- assertVisible:
    id: 'modal-2-body'

- tapOn:
    id: 'modal-close-second'
- assertNotVisible:
    id: 'modal-2-body'

- tapOn:
    id: 'modal-close-first'
- assertNotVisible:
    id: 'modal-1-body'
