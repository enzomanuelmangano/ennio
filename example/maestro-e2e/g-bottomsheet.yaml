appId: com.ennio.example
name: "Gauntlet — BottomSheet"
---
- launchApp:
    clearState: true
- tapOn: "Gauntlet"
- tapOn:
    id: "g-bottomsheet"
- assertVisible:
    id: "bottomsheet-screen"
- tapOn:
    id: "bottomsheet-open"
- assertVisible:
    id: "bottomsheet-opened-marker"
- assertVisible:
    id: "bottomsheet-body"
    timeout: 3000
- tapOn:
    id: "bottomsheet-close"
