appId: com.ennio.example
name: Grammar — system (alert, screenshot, hideKeyboard, swipe, longPress, doubleTap, back)
---
- launchApp
- tapOn:
    text: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-playground'
    direction: DOWN
- tapOn:
    id: 'g-playground'

# Native alert (Maestro lacks dismissAlert; tap the OK button to dismiss)
- scrollUntilVisible:
    element:
      id: 'open-alert-btn'
    direction: DOWN
- tapOn:
    id: 'open-alert-btn'
- assertVisible: 'Playground Alert'
- tapOn:
    text: 'OK'
- assertNotVisible: 'Playground Alert'

# takeScreenshot
- takeScreenshot: /tmp/grammar-system-pre-alert.png

# hideKeyboard (bare string + object form). search-input lives above the
# alert button. Scroll the playground ScrollView up to expose it.
- scroll:
    direction: UP
- scroll:
    direction: UP
- scroll:
    direction: UP
- scroll:
    direction: UP
- tapOn:
    id: 'search-input'
- inputText: 'test'
- hideKeyboard
- tapOn:
    id: 'search-input'
- eraseText

# doubleTap
- doubleTapOn:
    id: 'counter-inc-btn'

# longPress (Maestro uses longPressOn)
- longPressOn:
    id: 'counter-display'

# swipe (scroll the playground)
- swipe:
    direction: UP
    duration: 300
- swipe:
    direction: DOWN
    duration: 300

# back gesture — bare string is fine on a tab root in Maestro (no-op).
- back
