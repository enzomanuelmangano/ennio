# Test: Settings Flow
# Tests all settings toggles and configurations

appId: com.ennio.example
name: "Settings Flow"
tags:
  - settings

---

- launchApp:
    clearState: true

# ============================================
# SETUP
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Sign in so account-section settings (edit-profile, change-password,
# sign-out) render — flow scrolls to and asserts those later.
- runFlow:
    when:
      visible:
        id: "home-signin-btn"
    commands:
      - tapOn:
          id: "home-signin-btn"
      - tapOn:
          id: "demo-login-btn"
      - assertNotVisible:
          id: "demo-login-btn"
      - assertVisible:
          id: "home-screen"

# ============================================
# TEST: Navigate to settings via quick action
# ============================================

- tapOn:
    id: "quick-action-settings"

- assertVisible:
    id: "settings-screen"

# ============================================
# TEST: Appearance settings
# ============================================

# Dark mode toggle
- assertVisible:
    id: "toggle-dark-mode"

- tapOn:
    id: "toggle-dark-mode"

# UI should update to dark mode
# Toggle back
- tapOn:
    id: "toggle-dark-mode"

# Haptic feedback toggle
- assertVisible:
    id: "toggle-haptic"
- tapOn:
    id: "toggle-haptic"
- tapOn:
    id: "toggle-haptic"

# Notification badges toggle
- assertVisible:
    id: "toggle-badges"
- tapOn:
    id: "toggle-badges"
- tapOn:
    id: "toggle-badges"

# ============================================
# TEST: Notification settings
# ============================================

- scrollUntilVisible:
    element:
      id: "toggle-order-updates"
    direction: DOWN

# Order updates
- assertVisible:
    id: "toggle-order-updates"
- tapOn:
    id: "toggle-order-updates"
- tapOn:
    id: "toggle-order-updates"

# Promotions
- assertVisible:
    id: "toggle-promotions"
- tapOn:
    id: "toggle-promotions"

# New arrivals
- assertVisible:
    id: "toggle-new-arrivals"
- tapOn:
    id: "toggle-new-arrivals"
- tapOn:
    id: "toggle-new-arrivals"

# Price drops
- assertVisible:
    id: "toggle-price-drops"
- tapOn:
    id: "toggle-price-drops"
- tapOn:
    id: "toggle-price-drops"

# ============================================
# TEST: Privacy settings
# ============================================

- scrollUntilVisible:
    element:
      id: "toggle-analytics"
    direction: DOWN

# Analytics
- assertVisible:
    id: "toggle-analytics"
- tapOn:
    id: "toggle-analytics"

# Personalized ads
- assertVisible:
    id: "toggle-personalized-ads"
- tapOn:
    id: "toggle-personalized-ads"
- tapOn:
    id: "toggle-personalized-ads"

# Location services
- assertVisible:
    id: "toggle-location"
- tapOn:
    id: "toggle-location"
- tapOn:
    id: "toggle-location"

# ============================================
# TEST: Account settings (when logged in)
# ============================================

# Login first
- runFlow:
    file: subflows/navigate-home.yaml
- runFlow:
    when:
      visible:
        id: "home-signin-btn"
    commands:
      - tapOn:
          id: "home-signin-btn"
      - tapOn:
          id: "demo-login-btn"
      - waitForAnimationToEnd
      - assertNotVisible:
          id: "demo-login-btn"

- tapOn:
    id: "quick-action-settings"

- assertVisible:
    id: "settings-screen"

- scrollUntilVisible:
    element:
      id: "edit-profile"
    direction: DOWN

# Edit profile button
- assertVisible:
    id: "edit-profile"

# Change password button
- assertVisible:
    id: "change-password"

# Scroll until sign-out is on screen (settings scroll length varies
# with toggle states / dynamic island padding).
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN

# ============================================
# TEST: App info and legal
# ============================================

# Scroll the help row (the last asserted) into view; the earlier rows
# (app-version / terms / privacy-policy) sit above it in the same
# scrollable, so they're already visible by the time we land.
- scrollUntilVisible:
    element:
      id: "help"
    direction: DOWN

- assertVisible:
    id: "app-version"
- assertVisible:
    id: "terms"
- assertVisible:
    id: "privacy-policy"
- assertVisible:
    id: "help"

# ============================================
# TEST: Danger zone actions
# ============================================

# Scroll the danger-zone section into view (it sits at the bottom of
# the settings ScrollView).
- scrollUntilVisible:
    element:
      id: "reset-settings"
    direction: DOWN

# Clear cart & orders
- assertVisible:
    id: "clear-data"

# Reset all settings
- assertVisible:
    id: "reset-settings"

# Test reset settings with confirmation
- tapOn:
    id: "reset-settings"

- assertVisible:
    text: "Reset Settings"

# Cancel the reset
- tapOn:
    text: "Cancel"

# Settings should still be visible
- assertVisible:
    id: "settings-screen"

# ============================================
# TEST: Navigate via profile menu
# ============================================

# Pop the Stack-pushed settings screen so the tab bar is reachable.
- back

- tapOn:
    text: "Profile"

- assertVisible:
    id: "profile-screen"

- tapOn:
    id: "menu-settings"

- assertVisible:
    id: "settings-screen"

# ============================================
# TEST: Dark mode persists across screens
# ============================================

- scrollUntilVisible:
    element:
      id: "toggle-dark-mode"
    direction: UP

- tapOn:
    id: "toggle-dark-mode"

# Defensive: dismiss any stray alert that may still be up before tab nav.
- runFlow:
    when:
      visible:
        text: "OK"
    commands:
      - tapOn:
          text: "OK"

# Navigate to other screens and verify dark mode
- runFlow:
    file: subflows/navigate-home.yaml

# Navigate back and toggle off
- tapOn:
    id: "quick-action-settings"

- tapOn:
    id: "toggle-dark-mode"
