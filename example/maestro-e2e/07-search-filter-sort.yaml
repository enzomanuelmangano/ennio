# Test: Advanced Search, Filter & Sort
# Comprehensive tests for product discovery

appId: com.ennio.example
name: 'Search Filter Sort'
tags:
  - search
  - filter
  - sort

---
- launchApp:
    clearState: true

# ============================================
# SETUP
# ============================================

- runFlow:
    file: subflows/navigate-products.yaml

# ============================================
# TEST: Search exact match
# ============================================

- tapOn:
    id: 'search-input'
- inputText: 'Wireless Headphones'

- assertVisible:
    text: 'Wireless Headphones'

- tapOn:
    id: 'clear-search'

# ============================================
# TEST: Search partial match
# ============================================

- tapOn:
    id: 'search-input'
- inputText: 'Pro'

# Should find products with "Pro" in name
- assertVisible:
    text: 'Pro'

- tapOn:
    id: 'clear-search'

# ============================================
# TEST: Search case insensitive
# ============================================

- tapOn:
    id: 'search-input'
- inputText: 'WIRELESS'

- assertVisible:
    text: 'Wireless'

- tapOn:
    id: 'clear-search'

# ============================================
# TEST: Search no results
# ============================================

- tapOn:
    id: 'search-input'
- inputText: 'xyznonexistent123'
- hideKeyboard

- assertVisible:
    id: 'no-products'

- assertVisible:
    text: 'No products found'

- tapOn:
    id: 'reset-filters'

# ============================================
# TEST: Category filters
# ============================================

# All categories
- tapOn:
    id: 'filter-category-all'
- assertVisible:
    id: 'products-list'

# Electronics
- tapOn:
    id: 'filter-category-electronics'
- assertVisible:
    id: 'products-list'

# Sports
- tapOn:
    id: 'filter-category-sports'
- assertVisible:
    id: 'products-list'

# Home
- tapOn:
    id: 'filter-category-decor'
- assertVisible:
    id: 'products-list'

# Accessories
- tapOn:
    id: 'filter-category-accessories'
- assertVisible:
    id: 'products-list'

# Back to All
- tapOn:
    id: 'filter-category-all'

# ============================================
# TEST: Sort options
# ============================================
# zeego DropdownMenu = native UIMenu. Ennio detects the trigger and
# routes through idb HID; menu items are accessibility-resolvable once
# open and tap-by-text activates them.

# Price: Low to High
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: Low to High'

# Price: High to Low
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: High to Low'

# Name: A to Z
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Name: A to Z'

# Top Rated
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Top Rated'

# ============================================
# TEST: Combined filters - Electronics + search
# ============================================

- tapOn:
    id: 'filter-category-electronics'
- tapOn:
    id: 'search-input'
- inputText: 'Phone'

- assertVisible:
    id: 'products-list'

- tapOn:
    id: 'clear-search'

# ============================================
# TEST: Combined filters - Category + Sort
# ============================================

- tapOn:
    id: 'filter-category-sports'
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: Low to High'

- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Triple combo - Category + Search + Sort
# ============================================

- tapOn:
    id: 'filter-category-electronics'
- tapOn:
    id: 'search-input'
- inputText: 'Wireless'
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: High to Low'

- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Reset filters button
# ============================================

# Should have filters applied — top reset button visible whenever a
# filter or search is active.
- tapOn:
    id: 'reset-all'

# After reset, should show all products with default sort
- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Filter persists when viewing product
# ============================================

- tapOn:
    id: 'filter-category-electronics'
- tapOn:
    id: 'product-card-1'

- assertVisible:
    id: 'product-detail-screen'

# Go back
- back

# Filter should still be applied
- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Search from home category cards
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Shop-by-Category section is below the Featured carousel + Trending row.
- scrollUntilVisible:
    element:
      id: 'category-sports'
    direction: DOWN
- tapOn:
    id: 'category-sports'

- assertVisible:
    id: 'products-list'

# Sports filter should be active
- assertVisible:
    id: 'filter-category-sports'

# ============================================
# TEST: Scroll through products
# ============================================

- tapOn:
    id: 'filter-category-all'

- assertVisible:
    id: 'products-list'
