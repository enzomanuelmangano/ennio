# Test: Advanced Search, Filter & Sort
# Comprehensive tests for product discovery

appId: com.ennio.example
name: "Search Filter Sort"
tags:
  - search
  - filter
  - sort

---

- launchApp:
    clearState: true

# ============================================
# SETUP
# ============================================

- runFlow:
    file: subflows/navigate-products.yaml

# ============================================
# TEST: Search exact match
# ============================================

- tapOn:
    id: "search-input"
- inputText: "Wireless Headphones"

- assertVisible:
    text: "Wireless Headphones"
    timeout: 4000

- tapOn:
    id: "clear-search"

# ============================================
# TEST: Search partial match
# ============================================

- tapOn:
    id: "search-input"
- inputText: "Pro"

# Should find products with "Pro" in name
- assertVisible:
    text: "Pro"
    timeout: 4000

- tapOn:
    id: "clear-search"

# ============================================
# TEST: Search case insensitive
# ============================================

- tapOn:
    id: "search-input"
- inputText: "WIRELESS"

- assertVisible:
    text: "Wireless"
    timeout: 4000

- tapOn:
    id: "clear-search"

# ============================================
# TEST: Search no results
# ============================================

- tapOn:
    id: "search-input"
- inputText: "xyznonexistent123"

- assertVisible:
    id: "no-products"
    timeout: 4000

- assertVisible:
    text: "No products found"

- tapOn:
    id: "reset-filters"

# ============================================
# TEST: Category filters
# ============================================

# All categories
- tapOn:
    id: "filter-category-all"
- assertVisible:
    id: "products-list"

# Electronics
- tapOn:
    id: "filter-category-electronics"
- assertVisible:
    id: "products-list"
    timeout: 4000

# Sports
- tapOn:
    id: "filter-category-sports"
- assertVisible:
    id: "products-list"
    timeout: 4000

# Home
- tapOn:
    id: "filter-category-home"
- assertVisible:
    id: "products-list"
    timeout: 4000

# Accessories
- tapOn:
    id: "filter-category-accessories"
- assertVisible:
    id: "products-list"
    timeout: 4000

# Back to All
- tapOn:
    id: "filter-category-all"

# ============================================
# TEST: Sort options
# ============================================

# Open sort dropdown
- tapOn:
    id: "sort-dropdown"
- assertVisible:
    id: "sort-options"
    timeout: 1000

# Price: Low to High
- tapOn:
    id: "sort-option-price-asc"
- assertNotVisible:
    id: "sort-options"
    timeout: 5000

# Price: High to Low
- tapOn:
    id: "sort-dropdown"
- tapOn:
    id: "sort-option-price-desc"

# Name: A to Z
- tapOn:
    id: "sort-dropdown"
- tapOn:
    id: "sort-option-name"

# Top Rated
- tapOn:
    id: "sort-dropdown"
- tapOn:
    id: "sort-option-rating"

# ============================================
# TEST: Combined filters - Electronics + search
# ============================================

- tapOn:
    id: "filter-category-electronics"
- tapOn:
    id: "search-input"
- inputText: "Phone"

- assertVisible:
    id: "products-list"
    timeout: 4000

- tapOn:
    id: "clear-search"

# ============================================
# TEST: Combined filters - Category + Sort
# ============================================

- tapOn:
    id: "filter-category-sports"
- tapOn:
    id: "sort-dropdown"
- tapOn:
    id: "sort-option-price-asc"

- assertVisible:
    id: "products-list"
    timeout: 4000

# ============================================
# TEST: Triple combo - Category + Search + Sort
# ============================================

- tapOn:
    id: "filter-category-electronics"
- tapOn:
    id: "search-input"
- inputText: "Wireless"
- tapOn:
    id: "sort-dropdown"
- tapOn:
    id: "sort-option-price-desc"

- assertVisible:
    id: "products-list"
    timeout: 4000

# ============================================
# TEST: Reset filters button
# ============================================

# Should have filters applied — top reset button visible whenever a
# filter or search is active.
- tapOn:
    id: "reset-all"

# After reset, should show all products with default sort
- assertVisible:
    id: "products-list"
    timeout: 4000

# ============================================
# TEST: Filter persists when viewing product
# ============================================

- tapOn:
    id: "filter-category-electronics"
- tapOn:
    id: "product-card-1"

- assertVisible:
    id: "product-detail-screen"
    timeout: 5000

# Go back
- back

# Filter should still be applied
- assertVisible:
    id: "products-screen"
    timeout: 4000

# ============================================
# TEST: Search from home category cards
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: "category-sports"

- assertVisible:
    id: "products-screen"
    timeout: 5000

# Sports filter should be active
- assertVisible:
    id: "filter-category-sports"

# ============================================
# TEST: Scroll through products
# ============================================

- tapOn:
    id: "filter-category-all"

- scroll:
    direction: DOWN
    amount: 500

- scroll:
    direction: DOWN
    amount: 500

- scroll:
    direction: UP
    amount: 1000

- assertVisible:
    id: "products-list"
