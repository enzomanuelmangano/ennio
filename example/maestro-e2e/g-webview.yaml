appId: com.ennio.example
name: 'Gauntlet — WebView'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-webview'
    direction: DOWN
- tapOn:
    id: 'g-webview'
- assertVisible:
    id: 'webview-screen'
- assertVisible:
    id: 'webview-loaded-marker'
