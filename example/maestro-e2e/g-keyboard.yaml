appId: com.ennio.example
name: "Gauntlet — KeyboardAvoidingView"
---
- launchApp:
    clearState: true
- tapOn: "Gauntlet"
- scrollUntilVisible:
    element:
      id: "g-keyboard"
    direction: DOWN
- tapOn:
    id: "g-keyboard"
- assertVisible:
    id: "keyboard-screen"
- tapOn:
    id: "keyboard-input"
- inputText: "Hello"
- tapOn:
    id: "keyboard-submit"
- assertVisible:
    text: "Submitted: Hello"
