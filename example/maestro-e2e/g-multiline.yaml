appId: com.ennio.example
name: 'Gauntlet — Multi-line TextInput'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-multiline'
    direction: DOWN
- tapOn:
    id: 'g-multiline'
- assertVisible:
    id: 'multiline-screen'
- tapOn:
    id: 'multiline-input'
- inputText: 'First line'
- assertVisible:
    text: '10 chars'
