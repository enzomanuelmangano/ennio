appId: com.ennio.example
name: Grammar — input commands (text, random, erase, clear, paste, key)
---
- launchApp
- tapOn:
    text: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-playground'
    direction: DOWN
- tapOn:
    id: 'g-playground'
- assertVisible: 'Search'

# inputText — basic
- tapOn:
    id: 'search-input'
- inputText: 'banana'
- assertVisible:
    id: 'fruit-banana'
- assertNotVisible:
    id: 'fruit-apple'

# eraseText — drop characters
- eraseText: 6
- assertVisible:
    id: 'fruit-apple'

# eraseText then re-input via random
- tapOn:
    id: 'search-input'
- eraseText

# pressKey on focused field
- tapOn:
    id: 'search-input'
- inputText: 'fig'
- pressKey: 'Backspace'
- pressKey: 'Backspace'
- pressKey: 'Backspace'
- assertVisible:
    id: 'fruit-banana'

# inputRandomText (length 4)
- tapOn:
    id: 'search-input'
- inputRandomText:
    length: 4
- tapOn:
    id: 'search-input'
- eraseText

# inputRandomNumber (length 6)
- inputRandomNumber:
    length: 6
- tapOn:
    id: 'search-input'
- eraseText

# Clipboard — copy + paste
- inputText: 'cherry'
- assertVisible:
    id: 'fruit-cherry'
- setClipboard: 'elderberry'
- tapOn:
    id: 'search-input'
- eraseText
- pasteText
- assertVisible:
    id: 'fruit-elderberry'
