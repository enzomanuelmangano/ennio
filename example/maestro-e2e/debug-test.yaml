appId: com.ennio.example
name: 'Debug Test'
---
# Step 1
- tapOn:
    text: 'Home'
# Step 2
- assertVisible:
    id: 'home-screen'
# Step 3
- tapOn:
    text: 'Profile'
# Step 4 - Conditional
- runFlow:
    when:
      visible:
        id: 'profile-header'
    commands:
      - scrollUntilVisible:
          element:
            id: 'menu-logout'
          direction: DOWN
      - tapOn:
          id: 'menu-logout'
      - assertVisible:
          text: 'Sign Out'
      - tapOn:
          text: 'Sign Out'
      - assertVisible:
          id: 'guest-view'

# Back to home
- tapOn:
    text: 'Home'
- assertVisible:
    id: 'home-screen'

# Verify home screen elements
- assertVisible:
    id: 'home-screen'
- assertVisible:
    id: 'quick-action-search'
- assertVisible:
    id: 'quick-action-cart'
- assertVisible:
    id: 'quick-action-orders'
- assertVisible:
    id: 'quick-action-settings'

# Featured products
- assertVisible:
    text: 'Featured Products'

# Sign in button
- assertVisible:
    id: 'home-signin-btn'

# Login flow
- tapOn:
    id: 'home-signin-btn'
- assertVisible:
    id: 'login-screen'

# Use demo login
- tapOn:
    id: 'demo-login-btn'
- assertVisible:
    id: 'home-screen'

# Verify logged in
- assertVisible:
    text: 'Hello'

# Navigate to products
- tapOn:
    text: 'Products'
- assertVisible:
    id: 'products-screen'

# Test search
- tapOn:
    id: 'search-input'
- inputText: 'Wireless'
- assertVisible:
    text: 'Wireless'
# Nothing after
