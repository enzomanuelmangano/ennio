# Test: Simple Authentication Flow
# Tests demo login only

appId: com.tasto.example
name: "Authentication Flow"
tags:
  - auth
  - critical

---

# ============================================
# Navigate to home
# ============================================

- tapOn:
    text: "Home"

- assertVisible:
    id: "home-screen"
    timeout: 3000

# ============================================
# TEST: Demo login flow
# ============================================

# Tap sign in button on home
- tapOn:
    id: "home-signin-btn"

# Wait for login screen
- assertVisible:
    id: "login-screen"
    timeout: 3000

# Use demo login
- tapOn:
    id: "demo-login-btn"

# Should return to home with greeting
- assertVisible:
    id: "home-screen"
    timeout: 5000
