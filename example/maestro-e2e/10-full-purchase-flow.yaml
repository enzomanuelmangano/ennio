# Test: Full End-to-End Purchase Flow
# Complete journey from browse to order delivery

appId: com.ennio.example
name: 'Full Purchase Flow'
tags:
  - e2e
  - critical
  - purchase

---
- launchApp:
    clearState: true

# ============================================
# PHASE 1: Fresh Start
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# clearState above already logs out & empties cart — no cleanup needed.

# ============================================
# PHASE 2: Browse as Guest
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Explore featured products
- assertVisible:
    id: 'featured-product-1'

# Navigate via category
- scrollUntilVisible:
    element:
      id: 'category-electronics'
    direction: DOWN
- tapOn:
    id: 'category-electronics'

- assertVisible:
    id: 'products-list'

# Search for specific product
- tapOn:
    id: 'search-input'
- inputText: 'Wireless'

- assertVisible:
    text: 'Wireless'

# ============================================
# PHASE 3: Add Multiple Products to Cart
# ============================================

# Add first search result
- tapOn:
    id: 'product-card-1'

- assertVisible:
    id: 'product-detail-screen'

# Check product details
- assertVisible:
    id: 'product-title'
- assertVisible:
    id: 'product-price'

# View description tab
- tapOn:
    id: 'tab-description'
- assertVisible:
    id: 'product-description'

# Add 2 of this item
- tapOn:
    id: 'increase-quantity'
- tapOn:
    id: 'add-to-cart-btn'

# Continue shopping
- tapOn:
    text: 'Continue Shopping'

# Back to products
- back
- assertVisible:
    id: 'products-list'

# Clear search and find another product
- tapOn:
    id: 'clear-search'
- tapOn:
    id: 'filter-category-sports'

# Add another product from grid (id 5 = Running Shoes Elite, in Sports)
- tapOn:
    id: 'add-to-cart-5'

# ============================================
# PHASE 4: Review Cart
# ============================================

- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-screen'

# Should have multiple items
- assertVisible:
    id: 'cart-items-list'
- assertVisible:
    id: 'cart-summary'
- assertVisible:
    id: 'cart-total'

# Adjust quantity in cart
- tapOn:
    id: 'increase-qty-1'
- tapOn:
    id: 'decrease-qty-1'

# ============================================
# PHASE 5: Sign in via Profile (we need an authenticated user before
# checkout). The full register form-fill is exercised separately by
# 01-auth-flow; here we just take the fastest path.
# ============================================

- tapOn:
    text: 'Profile'

- tapOn:
    id: 'guest-signin-btn'

- assertVisible:
    id: 'login-screen'

- tapOn:
    id: 'demo-login-btn'

- waitForAnimationToEnd

# `router.dismiss()` returns to Profile (the modal opener), not home.
- assertVisible:
    id: 'profile-screen'

# ============================================
# PHASE 7: Cart Still Has Items
# ============================================

- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-screen'

# Items should still be there
- assertVisible:
    id: 'cart-items-list'

# ============================================
# PHASE 8: Complete Checkout
# ============================================

- tapOn:
    id: 'checkout-btn'

- waitForAnimationToEnd

- assertVisible:
    id: 'checkout-screen'

# STEP 1: Shipping
- assertVisible:
    id: 'shipping-form'

- tapOn:
    id: 'shipping-name'
- inputText: 'Jane Smith'

- tapOn:
    id: 'shipping-street'
- inputText: '789 Pine Street'

- tapOn:
    id: 'shipping-city'
- inputText: 'Los Angeles'

- tapOn:
    id: 'shipping-state'
- inputText: 'CA'

- tapOn:
    id: 'shipping-zip'
- inputText: '90001'

- tapOn:
    id: 'shipping-phone'
- inputText: '310-555-0199'

- tapOn:
    id: 'next-btn'

# STEP 2: Payment
- assertVisible:
    id: 'payment-form'

- tapOn:
    id: 'payment-card-number'
- inputText: '5555555555554444'

- tapOn:
    id: 'payment-cardholder'
- inputText: 'Jane Smith'

- tapOn:
    id: 'payment-expiry'
- inputText: '06/27'

- tapOn:
    id: 'payment-cvv'
- inputText: '321'

- tapOn:
    id: 'next-btn'

# STEP 3: Review
- assertVisible:
    id: 'order-review'

# Verify shipping shown
- assertVisible:
    text: '789 Pine Street'

# Verify payment masked
- assertVisible:
    text: '4444'

# Place the order
- tapOn:
    id: 'place-order-btn'

# ============================================
# PHASE 9: Order Confirmation
# ============================================

- assertVisible:
    text: 'Order Placed'

- tapOn:
    text: 'View Orders'

# ============================================
# PHASE 10: Verify Order in History
# ============================================

- assertVisible:
    id: 'orders-screen'

- assertVisible:
    id: 'orders-list'

# Latest order should be at top
- assertVisible:
    text: 'Processing'

# View order details — tap the order card. Match by the order status
# pill text "Processing" which is unique to the order card (cart and
# product views don't render it).
- tapOn:
    text: 'Processing'

- assertVisible:
    id: 'order-details'

# Verify order contains our items
- assertVisible:
    text: '789 Pine Street'

- tapOn:
    id: 'close-details'

# ============================================
# PHASE 11: Cart is Empty
# ============================================

- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-screen-empty'

# ============================================
# PHASE 12: Continue Shopping
# ============================================

- tapOn:
    id: 'browse-products-btn'

- assertVisible:
    id: 'products-list'

# ============================================
# PHASE 13: Quick Reorder Flow
# ============================================

# Add another product quickly from home. featured-1 is the first card
# in the horizontal carousel and always fully on-screen; featured-2's
# add-to-cart button sits below the right edge.
- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: 'add-to-cart-featured-1'

# Verify cart updated
- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-screen'

# Clear for next test
- tapOn:
    id: 'clear-cart-btn'
- tapOn:
    text: 'Clear'

# ============================================
# PHASE 14: Verify User Stats Updated
# ============================================

- tapOn:
    text: 'Profile'

- assertVisible:
    id: 'profile-screen'

# Stats should reflect the order
- assertVisible:
    id: 'stats-card'

# ============================================
# CLEANUP: Logout
# ============================================

- scrollUntilVisible:
    element:
      id: 'menu-logout'
    direction: DOWN
- tapOn:
    id: 'menu-logout'
- tapOn:
    text: 'Sign Out'

- assertVisible:
    id: 'guest-view'
