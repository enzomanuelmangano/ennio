# Subflow: Navigate to home screen

appId: com.ennio.example

---

# Pop any Stack-pushed screen so the tab bar is reachable. Maestro's
# `back` on iOS doesn't always pop RNScreens stacks reliably; if the
# tab bar isn't yet visible, skip — the next tapOn will fail clearly.
- runFlow:
    when:
      notVisible:
        id: "home-screen"
    commands:
      - back
      - waitForAnimationToEnd

- tapOn:
    text: "Home"
- assertVisible:
    id: "home-screen"
