# Subflow: Navigate to home screen

appId: com.ennio.example

---

# Hide any keyboard that may be intercepting tab-bar taps; pop one
# pushed Stack screen if any (no-op on tab root).
- hideKeyboard
- back
- waitForAnimationToEnd

- tapOn:
    text: "Home"
    index: 0
- assertVisible:
    id: "home-screen"
