# Subflow: Navigate to products screen

appId: com.ennio.example

---
# Conditional: dismiss a "(tabs)" overlay if it sneaks in.
- runFlow:
    when:
      visible: '(tabs)'
    commands:
      - tapOn:
          text: '(tabs)'
- waitForAnimationToEnd

- tapOn:
    text: 'Products'
- assertVisible:
    id: 'products-list'
