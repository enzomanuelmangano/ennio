# Subflow: Authentication helpers
# Reusable authentication flows for other tests

appId: com.tasto.example

---

# Login with demo credentials
- runFlow:
    when:
      visible:
        id: "login-screen"
    file: login-demo.yaml

---

# Login with demo credentials subflow
# Usage: runFlow: subflows/login-demo.yaml
- tapOn:
    id: "demo-login-btn"
- assertVisible:
    id: "home-screen"
    timeout: 5000
