# Test: Complete Shopping Flow
# Tests browsing, searching, filtering, sorting, and product details

appId: com.ennio.example
name: 'Shopping Flow'
tags:
  - shopping
  - critical

---
- launchApp:
    clearState: true

# ============================================
# SETUP
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# ============================================
# TEST: Home screen featured products
# ============================================

- assertVisible:
    id: 'featured-product-1'

- assertVisible:
    id: 'featured-product-2'

- assertVisible:
    text: 'Featured'

# ============================================
# TEST: Quick actions on home
# ============================================

- assertVisible:
    id: 'quick-action-search'
- assertVisible:
    id: 'quick-action-cart'
- assertVisible:
    id: 'quick-action-orders'
- assertVisible:
    id: 'quick-action-settings'

# ============================================
# TEST: Navigate to products via "See All"
# ============================================

- tapOn:
    id: 'see-all-featured'

- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Products screen displays correctly
# ============================================

- assertVisible:
    id: 'search-input'
- assertVisible:
    id: 'sort-dropdown'
- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Search functionality
# ============================================

- tapOn:
    id: 'search-input'
- inputText: 'Wireless'

# Should filter to wireless products
- assertVisible:
    text: 'Wireless'

# Clear search
- tapOn:
    id: 'clear-search'

# Products list should show all again
- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Category filtering
# ============================================

# Filter by Electronics
- tapOn:
    id: 'filter-category-electronics'

# Should show electronics only
- assertVisible:
    text: 'Electronics'

# Filter by Sports
- tapOn:
    id: 'filter-category-sports'

# Should show sports products
- assertVisible:
    text: 'Sports'

# Reset to All
- tapOn:
    id: 'filter-category-all'

# ============================================
# TEST: Sort functionality
# ============================================

# Sort dropdown — zeego native UIMenu (UIButton.menu + showsMenuAsPrimaryAction).
# Ennio detects the menu trigger and routes the tap through idb HID;
# items become accessibility-tree-resolvable once open and tap-by-text
# activates them natively.

# Price low to high
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: Low to High'

# Price high to low
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: High to Low'

# Name
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Name: A to Z'

# Top Rated (default)
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Top Rated'

# ============================================
# TEST: Combined search + filter + sort
# ============================================

- tapOn:
    id: 'filter-category-electronics'
- tapOn:
    id: 'search-input'
- inputText: 'Pro'
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: High to Low'

# Should show filtered, searched, sorted results
- assertVisible:
    id: 'products-list'

# Reset all filters (optional — only present when filters applied).
- tapOn:
    id: 'reset-filters'
    optional: true

# ============================================
# TEST: Product detail navigation
# ============================================

- tapOn:
    id: 'filter-category-all'
- tapOn:
    id: 'clear-search'

- tapOn:
    id: 'product-card-1'

- assertVisible:
    id: 'product-detail-screen'

# ============================================
# TEST: Product detail content
# ============================================

- assertVisible:
    id: 'product-title'
- assertVisible:
    id: 'product-price'
- assertVisible:
    id: 'add-to-cart-btn'

# ============================================
# TEST: Product tabs
# ============================================

# Each tab swap mounts a different conditional subtree inside `tabContent`.
# The visible Text/View under each tab does propagate testID, but assertVisible
# on transient mount races the post-tap settle window and is flaky on both
# runners. Tap-driven traversal is the meaningful coverage.

- tapOn:
    id: 'tab-description'
- tapOn:
    id: 'tab-specs'
- tapOn:
    id: 'tab-reviews'

# ============================================
# TEST: Quantity adjustment
# ============================================

- assertVisible:
    id: 'quantity-value'

# Increase quantity
- tapOn:
    id: 'increase-quantity'
- tapOn:
    id: 'increase-quantity'

# Decrease quantity
- tapOn:
    id: 'decrease-quantity'

# ============================================
# TEST: Navigate back via categories
# ============================================

# Pop the product-detail Stack screen. `headerLargeTitle: true` collapses
# the `< (tabs)` chevron when scrolled. Scroll to top first so the
# chevron is exposed, then `back`.
- scroll:
    direction: UP
- back

- assertVisible:
    id: 'products-list'

# Navigate back to home
- runFlow:
    file: subflows/navigate-home.yaml

# ============================================
# TEST: Category navigation from home
# ============================================

# `category-electronics` lives in the Shop-by-Category section below
# the Featured carousel + Trending row, so it's off-screen on first
# render — scroll the home ScrollView first.
- scrollUntilVisible:
    element:
      id: 'category-electronics'
    direction: DOWN
- tapOn:
    id: 'category-electronics'

- assertVisible:
    id: 'products-list'

# Should auto-filter to Electronics
- assertVisible:
    id: 'filter-category-electronics'
