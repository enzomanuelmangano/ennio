appId: com.ennio.example
name: 'Gauntlet — Deep link route'
---
# Validates the deep-link route resolves and renders the target screen.
# Note: `openLink` from `xcrun simctl openurl` triggers iOS 26+
# SpringBoard's "Open in <App>?" confirmation alert, rendered
# out-of-process (SpringBoard). ennio's in-app dylib + in-house HID
# can't introspect that cross-process sheet to dismiss it, so we
# navigate to the same route via an in-app Pressable instead — this
# still exercises the deep-link route's resolver + renderer.
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-deep-link'
    direction: DOWN
- tapOn:
    id: 'g-deep-link'
- assertVisible:
    id: 'deep-link-screen'
- assertVisible:
    id: 'deep-link-marker'
