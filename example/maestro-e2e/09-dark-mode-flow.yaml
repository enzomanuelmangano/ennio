# Test: Dark Mode Flow
# Tests dark mode toggle and persistence across screens

appId: com.ennio.example
name: 'Dark Mode Flow'
tags:
  - dark-mode
  - appearance

---
- launchApp:
    clearState: true

# ============================================
# SETUP: Ensure light mode
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: 'quick-action-settings'

- assertVisible:
    id: 'settings-screen'

# Ensure dark mode is off first
# (We'll toggle twice to ensure consistent state)
- tapOn:
    id: 'toggle-dark-mode'
- tapOn:
    id: 'toggle-dark-mode'

# ============================================
# TEST: Enable dark mode
# ============================================

- tapOn:
    id: 'toggle-dark-mode'

# Settings screen should update
- assertVisible:
    id: 'settings-screen'

# ============================================
# TEST: Dark mode persists on home
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- assertVisible:
    id: 'home-screen'

# Home should be in dark mode
- assertVisible:
    id: 'featured-product-1'

# ============================================
# TEST: Dark mode on products screen
# ============================================

- runFlow:
    file: subflows/navigate-products.yaml

- assertVisible:
    id: 'products-list'

- assertVisible:
    id: 'search-input'
- assertVisible:
    id: 'products-list'

# ============================================
# TEST: Dark mode on product detail
# ============================================

- tapOn:
    id: 'product-card-1'

- assertVisible:
    id: 'product-detail-screen'

- assertVisible:
    id: 'product-title'
- assertVisible:
    id: 'add-to-cart-btn'

- back

# ============================================
# TEST: Dark mode on cart
# ============================================

- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-root'

# ============================================
# TEST: Dark mode on profile (guest)
# ============================================

- tapOn:
    text: 'Profile'

- assertVisible:
    id: 'profile-root'

# ============================================
# TEST: Dark mode on login screen
# ============================================

# Guest profile is visible after clearState (we never logged in this run).
- tapOn:
    id: 'guest-signin-btn'
- assertVisible:
    id: 'login-screen'
- assertVisible:
    id: 'email-input'
- assertVisible:
    id: 'login-btn'
- back

# ============================================
# TEST: Toggle dark mode off
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: 'quick-action-settings'

- assertVisible:
    id: 'settings-screen'

- tapOn:
    id: 'toggle-dark-mode'

# ============================================
# TEST: Light mode restored on all screens
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- assertVisible:
    id: 'home-screen'

- runFlow:
    file: subflows/navigate-products.yaml

- assertVisible:
    id: 'products-list'

- runFlow:
    file: subflows/navigate-cart.yaml

- assertVisible:
    id: 'cart-root'

# ============================================
# TEST: Dark mode with authenticated user
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# Login (we logged out earlier in this flow).
- tapOn:
    id: 'home-signin-btn'
- tapOn:
    id: 'demo-login-btn'

- assertVisible:
    id: 'home-screen'

# Enable dark mode
- tapOn:
    id: 'quick-action-settings'
- tapOn:
    id: 'toggle-dark-mode'

# Check profile in dark mode
- tapOn:
    text: 'Profile'

- assertVisible:
    id: 'profile-screen'

- assertVisible:
    id: 'profile-header'

# Check orders in dark mode
- tapOn:
    id: 'menu-orders'

- assertVisible:
    id: 'orders-screen'

# ============================================
# CLEANUP: Restore light mode
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

- tapOn:
    id: 'quick-action-settings'

- tapOn:
    id: 'toggle-dark-mode'

- assertVisible:
    id: 'settings-screen'
