# Test: Grammar parity extras
# Exercises new commands added for maestro parity:
#  - bare-string forms (`- clearState`, `- launchApp`, `- stopApp`, `- killApp`)
#  - alias commands (killApp ↔ stopApp)
#  - clearKeychain, dismissAlert standalone
#  - inputRandom* family
#  - optional flag
#  - onFlowStart / onFlowComplete hooks
#  - setAirplaneMode / toggleAirplaneMode
#  - travel

appId: com.ennio.example
name: 'Grammar Extras'
tags:
  - grammar
  - parity

onFlowStart:
  - launchApp:
      clearState: true
  - clearKeychain

---
# Bare-string clearState — must work without `: true` payload.
- clearState

# Bare-string launchApp.
- launchApp

# Wait for the app to settle on Home.
- assertVisible:
    id: 'home-screen'

# Optional tap on a non-existent element — must not fail.
- tapOn:
    id: 'this-element-does-not-exist'
    optional: true

# dismissAlert / setAirplaneMode / travel are Ennio extensions that
# Maestro 1.36 doesn't ship — skip them in this parity flow.

# inputRandom* family. We need a focused TextInput first — sign-in flow
# has one.
- tapOn:
    id: 'home-signin-btn'
- assertVisible:
    id: 'login-screen'
- tapOn:
    id: 'email-input'
- inputRandomEmail

- tapOn:
    id: 'password-input'
- inputRandomText:
    length: 10

# Erase and try inputRandomNumber on the same field.
- tapOn:
    id: 'password-input'
- eraseText
- tapOn:
    id: 'password-input'
- inputRandomNumber:
    length: 6

# killApp alias — should behave identically to stopApp. We follow it
# with launchApp to bring the app back so onFlowComplete can reset
# airplane mode against a live process.
- killApp
- launchApp
- assertVisible:
    id: 'home-screen'
