appId: com.ennio.example
name: 'Gauntlet — Alert variants'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-alert'
    direction: DOWN
- tapOn:
    id: 'g-alert'
- assertVisible:
    id: 'alert-screen'

# Single button
- tapOn:
    id: 'alert-single'
- tapOn: 'OK'
- assertVisible:
    text: 'single-ok'

# Two button — destructive (Cancel)
- tapOn:
    id: 'alert-two'
- tapOn: 'Cancel'
- assertVisible:
    text: 'two-cancel'

# Three button — Save
- tapOn:
    id: 'alert-three'
- tapOn: 'Save'
- assertVisible:
    text: 'three-save'
