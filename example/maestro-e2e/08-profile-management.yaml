# Test: Profile Management Flow
# Tests profile view, edit, menu navigation

appId: com.ennio.example
name: "Profile Management"
tags:
  - profile
  - auth-required

---

- launchApp:
    clearState: true

# ============================================
# SETUP
# ============================================

- runFlow:
    file: subflows/navigate-home.yaml

# ============================================
# TEST: Guest profile view
# ============================================

- tapOn:
    text: "Profile"

# Guest view (clearState ensures we start logged out).
- assertVisible:
    text: "Sign In"
- assertVisible:
    id: "guest-signin-btn"
- assertVisible:
    id: "guest-register-btn"

# ============================================
# TEST: Login from guest profile
# ============================================

- tapOn:
    id: "guest-signin-btn"
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "demo-login-btn"
- assertVisible:
    id: "home-screen"

# Navigate back to profile
- tapOn:
    text: "Profile"

- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Authenticated profile header
# ============================================

- assertVisible:
    id: "profile-header"

- assertVisible:
    text: "Demo User"

# Edit profile button
- assertVisible:
    id: "edit-profile-btn"

# ============================================
# TEST: Profile stats card
# ============================================

- assertVisible:
    id: "stats-card"

# Stats should show orders, in-cart, spent
- assertVisible:
    text: "Orders"
- assertVisible:
    text: "In Cart"
- assertVisible:
    text: "Spent"

# ============================================
# TEST: Profile menu items
# ============================================

# Account section
- assertVisible:
    id: "menu-orders"
- assertVisible:
    id: "menu-payment"
- assertVisible:
    id: "menu-addresses"

# Preferences section
- scrollUntilVisible:
    element:
      id: "menu-settings"
    direction: DOWN

- assertVisible:
    id: "menu-settings"
- assertVisible:
    id: "menu-notifications"
- assertVisible:
    id: "menu-appearance"

# Support section
- scrollUntilVisible:
    element:
      id: "menu-help"
    direction: DOWN

- assertVisible:
    id: "menu-help"
- assertVisible:
    id: "menu-contact"
- assertVisible:
    id: "menu-terms"

# Logout
- scrollUntilVisible:
    element:
      id: "menu-logout"
    direction: DOWN
- assertVisible:
    id: "menu-logout"

# ============================================
# TEST: Navigate to orders from profile
# ============================================

- scrollUntilVisible:
    element:
      id: "menu-orders"
    direction: UP

- tapOn:
    id: "menu-orders"

- assertVisible:
    id: "orders-screen"

# Go back to profile via tab bar — iOS RNScreens `back` is unreliable
# from a Stack-pushed screen.
- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Navigate to settings from profile
# ============================================

- tapOn:
    id: "menu-settings"

- assertVisible:
    id: "settings-screen"

# Go back via tab bar.
- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Navigate to appearance from profile
# ============================================

- tapOn:
    id: "menu-appearance"

# Should go to settings (appearance section)
- assertVisible:
    id: "settings-screen"

- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Navigate to help from profile
# ============================================

- scrollUntilVisible:
    element:
      id: "menu-help"
    direction: DOWN

- tapOn:
    id: "menu-help"

# Help alert
- assertVisible:
    text: "Help Center"
- tapOn:
    text: "OK"

- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Navigate to terms from profile
# ============================================

- tapOn:
    id: "menu-terms"

- assertVisible:
    text: "Terms & Privacy"
- tapOn:
    text: "OK"

- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Logout confirmation
# ============================================

- scrollUntilVisible:
    element:
      id: "menu-logout"
    direction: DOWN
- tapOn:
    id: "menu-logout"

# Confirmation dialog
- assertVisible:
    text: "Sign Out"

# Cancel logout
- tapOn:
    text: "Cancel"

# Should still be on profile
- assertVisible:
    id: "profile-screen"

# ============================================
# TEST: Complete logout
# ============================================

- scrollUntilVisible:
    element:
      id: "menu-logout"
    direction: DOWN
- tapOn:
    id: "menu-logout"

- tapOn:
    text: "Sign Out"

# Should show guest view
- assertVisible:
    id: "guest-view"
