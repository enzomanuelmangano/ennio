appId: com.ennio.example
name: 'Gauntlet — FlashList'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- assertVisible:
    id: 'gauntlet-screen'
- scrollUntilVisible:
    element:
      id: 'g-flashlist'
    direction: DOWN
- tapOn:
    id: 'g-flashlist'
- assertVisible:
    id: 'flashlist-screen'
- assertVisible:
    id: 'flash-0'
- assertVisible:
    text: 'Item #1'
- scrollUntilVisible:
    element:
      text: 'Item #5'
    direction: DOWN
- assertVisible:
    text: 'Item #5'
