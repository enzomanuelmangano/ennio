# Alert Test
# Tests native iOS Alert handling with login/logout flow

appId: com.tasto.example
name: "Native Alert Test"

---

# Go to home first
- tapOn:
    id: "tab-home"
- assertVisible:
    id: "home-screen"
    timeout: 3000

# Check profile state and login if needed
- tapOn:
    id: "tab-profile"

# If guest-view visible, need to login
- runFlow:
    when:
      visible:
        id: "guest-view"
    commands:
      # Go to home and login
      - tapOn:
          id: "tab-home"
      - tapOn:
          id: "home-signin-btn"
      - assertVisible:
          id: "login-screen"
          timeout: 3000
      - tapOn:
          id: "demo-login-btn"
      - assertVisible:
          id: "home-screen"
          timeout: 5000

# Now go to profile (should be logged in)
- tapOn:
    id: "tab-profile"

# Verify logged in
- assertVisible:
    id: "profile-header"
    timeout: 3000

# Tap logout
- tapOn:
    id: "menu-logout"

# Assert alert is visible with Sign Out button
- assertVisible:
    text: "Sign Out"
    timeout: 3000

# Tap Sign Out (native alert button)
- tapOn:
    text: "Sign Out"

# Verify logged out
- assertVisible:
    id: "guest-view"
    timeout: 3000

# Back to home
- tapOn:
    id: "tab-home"
- assertVisible:
    id: "home-screen"
    timeout: 3000
