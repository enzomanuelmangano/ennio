appId: com.ennio.example
name: 'Gauntlet — Switch + Stepper'
---
- launchApp:
    clearState: true
- tapOn: 'Gauntlet'
- scrollUntilVisible:
    element:
      id: 'g-switch'
    direction: DOWN
- tapOn:
    id: 'g-switch'
- assertVisible:
    id: 'switch-stepper-screen'
- assertVisible:
    text: 'off'
- tapOn:
    id: 'switch-control'
- assertVisible:
    text: 'on'
- tapOn:
    id: 'stepper-inc'
- tapOn:
    id: 'stepper-inc'
- tapOn:
    id: 'stepper-inc'
- assertVisible:
    text: '3'
- tapOn:
    id: 'stepper-dec'
- assertVisible:
    text: '2'
