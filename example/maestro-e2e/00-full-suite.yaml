# Full App Test Suite
# Comprehensive E2E test covering all app functionality
# Run with: npx ennio maestro-e2e/00-full-suite.yaml

appId: com.ennio.example
name: 'Full App Test Suite'
tags:
  - suite
  - full
  - e2e

---
- launchApp:
    clearState: true

# ============================================
# PHASE 1: SETUP - Ensure Clean State
# ============================================

# Navigate to home
- tapOn:
    text: 'Home'
- assertVisible:
    id: 'home-screen'

# Logout if logged in (check profile first)
- tapOn:
    text: 'Profile'

# If profile-header visible = logged in, need to logout
- runFlow:
    when:
      visible:
        id: 'profile-header'
    commands:
      - scrollUntilVisible:
          element:
            id: 'menu-logout'
          direction: DOWN
      - tapOn:
          id: 'menu-logout'
      - assertVisible:
          text: 'Sign Out'
      - tapOn:
          text: 'Sign Out'
      - assertVisible:
          id: 'guest-view'

# Back to home
- tapOn:
    text: 'Home'
- assertVisible:
    id: 'home-screen'

# ============================================
# PHASE 2: HOME SCREEN - Guest View
# ============================================

# Verify home screen elements
- assertVisible:
    id: 'home-screen'

# Quick actions
- assertVisible:
    id: 'quick-action-search'
- assertVisible:
    id: 'quick-action-cart'
- assertVisible:
    id: 'quick-action-orders'
- assertVisible:
    id: 'quick-action-settings'

# Featured products section
- assertVisible:
    text: 'Featured'

# Sign in button should be visible for guest
- assertVisible:
    id: 'home-signin-btn'

# ============================================
# PHASE 3: AUTHENTICATION - Login Flow
# ============================================

# Navigate to login
- tapOn:
    id: 'home-signin-btn'
- assertVisible:
    id: 'login-screen'

# Verify login form elements
- assertVisible:
    id: 'email-input'
- assertVisible:
    id: 'password-input'
- assertVisible:
    id: 'login-btn'
- assertVisible:
    id: 'demo-login-btn'

# Test validation - empty submit
- tapOn:
    id: 'login-btn'
- assertVisible:
    id: 'email-error'

# Navigate to registration
- tapOn:
    id: 'go-to-register'
- assertVisible:
    id: 'register-screen'

# Verify registration form
- assertVisible:
    id: 'name-input'
- assertVisible:
    id: 'email-input'
- assertVisible:
    id: 'password-input'
- assertVisible:
    id: 'register-btn'

# Pop register screen with `back` so demo-login below dismisses cleanly
# back to the tab tree (router.dismiss() pops one stack frame at a time;
# tapping go-to-login from here would push a second login on top instead
# of returning to the first).
- back
- assertVisible:
    id: 'login-screen'

# Use demo login
- tapOn:
    id: 'demo-login-btn'
- assertVisible:
    id: 'home-screen'

# Verify logged in state
- assertVisible:
    text: 'Hello'

# ============================================
# PHASE 4: PRODUCTS - Browse & Search
# ============================================

# Navigate to products
- tapOn:
    text: 'Products'
- assertVisible:
    id: 'products-list'

# Verify products screen elements
- assertVisible:
    id: 'search-input'
- assertVisible:
    id: 'sort-dropdown'
- assertVisible:
    id: 'products-list'

# Test search
- tapOn:
    id: 'search-input'
- inputText: 'Wireless'
- assertVisible:
    text: 'Wireless'

# Clear search
- tapOn:
    id: 'clear-search'
- assertVisible:
    id: 'products-list'

# Test category filters
- tapOn:
    id: 'filter-category-electronics'
- assertVisible:
    id: 'products-list'

- tapOn:
    id: 'filter-category-all'
- assertVisible:
    id: 'products-list'

# Test sort. Sort menu is a Zeego native UIKit DropdownMenu; its options
# don't live in the React tree, so we tap the menu item by visible text.
- tapOn:
    id: 'sort-dropdown'
- tapOn:
    text: 'Price: Low to High'

# ============================================
# PHASE 5: PRODUCT DETAIL
# ============================================

# Open first product
- tapOn:
    id: 'product-card-1'
- assertVisible:
    id: 'product-detail-screen'

# Verify product detail elements
- assertVisible:
    id: 'product-title'
- assertVisible:
    id: 'product-price'
- assertVisible:
    id: 'add-to-cart-btn'

# Test tabs. `product-description` is mounted on initial render so it's
# safe to assertVisible immediately. The other two tabs swap content via
# conditional render; the parent View can have a zero-frame moment right
# after the tab tap, so we only verify the tap-target swap, not the
# content container (02-shopping-flow exercises content verification).
- tapOn:
    id: 'tab-description'
- assertVisible:
    id: 'product-description'

- tapOn:
    id: 'tab-specs'

- tapOn:
    id: 'tab-reviews'

# Test quantity
- tapOn:
    id: 'increase-quantity'
- tapOn:
    id: 'increase-quantity'
- tapOn:
    id: 'decrease-quantity'

# Add to cart
- tapOn:
    id: 'add-to-cart-btn'
- assertVisible:
    text: 'Added to Cart'
- tapOn:
    text: 'Continue Shopping'

# ============================================
# PHASE 6: CART MANAGEMENT
# ============================================

# Navigate to cart
- tapOn:
    text: 'Cart'
- assertVisible:
    id: 'cart-screen'

# Verify cart has items
- assertVisible:
    id: 'cart-items-list'
- assertVisible:
    id: 'cart-summary'
- assertVisible:
    id: 'cart-total'
- assertVisible:
    id: 'checkout-btn'

# Test quantity adjustment
- runFlow:
    when:
      visible:
        id: 'increase-qty-1'
    commands:
      - tapOn:
          id: 'increase-qty-1'
      - tapOn:
          id: 'decrease-qty-1'

# ============================================
# PHASE 7: CHECKOUT FLOW
# ============================================

# Start checkout
- tapOn:
    id: 'checkout-btn'
- assertVisible:
    id: 'checkout-screen'

# Step 1: Shipping
- assertVisible:
    id: 'shipping-form'

- tapOn:
    id: 'shipping-name'
- inputText: 'Test User'

- tapOn:
    id: 'shipping-street'
- inputText: '123 Test Street'

- tapOn:
    id: 'shipping-city'
- inputText: 'Test City'

- tapOn:
    id: 'shipping-state'
- inputText: 'CA'

- tapOn:
    id: 'shipping-zip'
- inputText: '12345'

- tapOn:
    id: 'shipping-phone'
- inputText: '555-555-5555'

- tapOn:
    id: 'next-btn'

# Step 2: Payment
- assertVisible:
    id: 'payment-form'

- tapOn:
    id: 'payment-card-number'
- inputText: '4111111111111111'

- tapOn:
    id: 'payment-cardholder'
- inputText: 'Test User'

- tapOn:
    id: 'payment-expiry'
- inputText: '12/28'

- tapOn:
    id: 'payment-cvv'
- inputText: '123'

- tapOn:
    id: 'next-btn'

# Step 3: Review
- assertVisible:
    id: 'order-review'

- assertVisible:
    text: '123 Test Street'
# Review card masks the number as "•••• •••• •••• 1111"; just match the
# last-4 since the bullets/spaces aren't load-bearing.
- assertVisible:
    text: '1111'

# Place order
- tapOn:
    id: 'place-order-btn'

# Order confirmation
- assertVisible:
    text: 'Order Placed'

- tapOn:
    text: 'View Orders'

# ============================================
# PHASE 8: ORDERS
# ============================================

- assertVisible:
    id: 'orders-screen'

- assertVisible:
    id: 'orders-list'

# Verify order status
- assertVisible:
    text: 'Processing'

# ============================================
# PHASE 9: PROFILE
# ============================================

- tapOn:
    text: 'Profile'
- assertVisible:
    id: 'profile-screen'

# Verify profile elements
- assertVisible:
    id: 'profile-header'
- assertVisible:
    id: 'stats-card'

# Menu items. menu-orders is at the top (no scroll). menu-settings is
# in the Preferences section below the fold; scroll it into view here
# so the Phase-10 tap on menu-settings can hit it directly. The deeper
# menu-logout is handled by Phase 12's own scrollUntilVisible.
- assertVisible:
    id: 'menu-orders'

- scrollUntilVisible:
    element:
      id: 'menu-settings'
    direction: DOWN

# ============================================
# PHASE 10: SETTINGS
# ============================================

- tapOn:
    id: 'menu-settings'
- assertVisible:
    id: 'settings-screen'

# Test dark mode toggle
- tapOn:
    id: 'toggle-dark-mode'
- tapOn:
    id: 'toggle-dark-mode'

# Back to profile
- tapOn:
    text: 'Profile'
- assertVisible:
    id: 'profile-screen'

# ============================================
# PHASE 11: CART IS EMPTY AFTER ORDER
# ============================================

- tapOn:
    text: 'Cart'
- assertVisible:
    id: 'cart-screen-empty'

- assertVisible:
    text: 'Your cart is empty'

# ============================================
# PHASE 12: CLEANUP - Logout
# ============================================

- tapOn:
    text: 'Profile'
- assertVisible:
    id: 'profile-screen'

- tapOn:
    id: 'menu-logout'
- assertVisible:
    text: 'Sign Out'
- tapOn:
    text: 'Sign Out'

- assertVisible:
    id: 'guest-view'
# ============================================
# SUITE COMPLETE
# ============================================
