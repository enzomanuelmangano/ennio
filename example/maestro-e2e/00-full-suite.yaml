# Full App Test Suite
# Comprehensive E2E test covering all app functionality
# Run with: npx tasto maestro-e2e/00-full-suite.yaml

appId: com.tasto.example
name: "Full App Test Suite"
tags:
  - suite
  - full
  - e2e

---

# ============================================
# PHASE 1: SETUP - Ensure Clean State
# ============================================

# Navigate to home
- tapOn:
    text: "Home"
- assertVisible:
    id: "home-screen"
    timeout: 5000

# Logout if logged in (check profile first)
- tapOn:
    text: "Profile"

# If profile-header visible = logged in, need to logout
- runFlow:
    when:
      visible:
        id: "profile-header"
    commands:
      # Scroll to find logout button
      - scroll:
          direction: DOWN
          amount: 500
      - tapOn:
          id: "menu-logout"
      - assertVisible:
          text: "Sign Out"
          timeout: 2000
      - tapOn:
          text: "Sign Out"
      - assertVisible:
          id: "guest-view"
          timeout: 3000

# Back to home
- tapOn:
    text: "Home"
- assertVisible:
    id: "home-screen"
    timeout: 3000

# ============================================
# PHASE 2: HOME SCREEN - Guest View
# ============================================

# Verify home screen elements
- assertVisible:
    id: "home-screen"

# Quick actions
- assertVisible:
    id: "quick-action-search"
- assertVisible:
    id: "quick-action-cart"
- assertVisible:
    id: "quick-action-orders"
- assertVisible:
    id: "quick-action-settings"

# Featured products section
- assertVisible:
    text: "Featured Products"
    timeout: 3000

# Sign in button should be visible for guest
- assertVisible:
    id: "home-signin-btn"
    timeout: 3000

# ============================================
# PHASE 3: AUTHENTICATION - Login Flow
# ============================================

# Navigate to login
- tapOn:
    id: "home-signin-btn"
- assertVisible:
    id: "login-screen"
    timeout: 3000

# Verify login form elements
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"
- assertVisible:
    id: "login-btn"
- assertVisible:
    id: "demo-login-btn"

# Test validation - empty submit
- tapOn:
    id: "login-btn"
- assertVisible:
    id: "email-error"
    timeout: 2000

# Navigate to registration
- tapOn:
    id: "go-to-register"
- assertVisible:
    id: "register-screen"
    timeout: 3000

# Verify registration form
- assertVisible:
    id: "name-input"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"
- assertVisible:
    id: "register-btn"

# Go back to login
- tapOn:
    id: "go-to-login"
- assertVisible:
    id: "login-screen"
    timeout: 3000

# Use demo login
- tapOn:
    id: "demo-login-btn"
- assertVisible:
    id: "home-screen"
    timeout: 5000

# Verify logged in state
- assertVisible:
    text: "Hello"
    timeout: 3000

# ============================================
# PHASE 4: PRODUCTS - Browse & Search
# ============================================

# Navigate to products
- tapOn:
    text: "Products"
- assertVisible:
    id: "products-screen"
    timeout: 3000

# Verify products screen elements
- assertVisible:
    id: "search-input"
- assertVisible:
    id: "sort-dropdown"
- assertVisible:
    id: "products-list"

# Test search
- tapOn:
    id: "search-input"
- inputText: "Wireless"
- assertVisible:
    text: "Wireless"
    timeout: 3000

# Clear search
- tapOn:
    id: "clear-search"
- assertVisible:
    id: "products-list"
    timeout: 2000

# Test category filters
- tapOn:
    id: "filter-category-electronics"
- assertVisible:
    id: "products-list"
    timeout: 2000

- tapOn:
    id: "filter-category-all"
- assertVisible:
    id: "products-list"
    timeout: 2000

# Test sort
- tapOn:
    id: "sort-dropdown"
- assertVisible:
    id: "sort-options"
    timeout: 2000
- tapOn:
    id: "sort-option-price-asc"

# ============================================
# PHASE 5: PRODUCT DETAIL
# ============================================

# Open first product
- tapOn:
    id: "product-card-1"
- assertVisible:
    id: "product-detail-screen"
    timeout: 3000

# Verify product detail elements
- assertVisible:
    id: "product-title"
- assertVisible:
    id: "product-price"
- assertVisible:
    id: "add-to-cart-btn"

# Test tabs
- tapOn:
    id: "tab-description"
- assertVisible:
    id: "product-description"
    timeout: 2000

- tapOn:
    id: "tab-specs"
- assertVisible:
    id: "product-specs"
    timeout: 2000

- tapOn:
    id: "tab-reviews"
- assertVisible:
    id: "product-reviews"
    timeout: 2000

# Test quantity
- tapOn:
    id: "increase-quantity"
- tapOn:
    id: "increase-quantity"
- tapOn:
    id: "decrease-quantity"

# Add to cart
- tapOn:
    id: "add-to-cart-btn"
- assertVisible:
    text: "Added to Cart"
    timeout: 3000
- tapOn:
    text: "Continue Shopping"

# ============================================
# PHASE 6: CART MANAGEMENT
# ============================================

# Navigate to cart
- tapOn:
    text: "Cart"
- assertVisible:
    id: "cart-screen"
    timeout: 3000

# Verify cart has items
- assertVisible:
    id: "cart-items-list"
- assertVisible:
    id: "cart-summary"
- assertVisible:
    id: "cart-total"
- assertVisible:
    id: "checkout-btn"

# Test quantity adjustment
- runFlow:
    when:
      visible:
        id: "increase-qty-1"
    commands:
      - tapOn:
          id: "increase-qty-1"
      - tapOn:
          id: "decrease-qty-1"

# ============================================
# PHASE 7: CHECKOUT FLOW
# ============================================

# Start checkout
- tapOn:
    id: "checkout-btn"
- assertVisible:
    id: "checkout-screen"
    timeout: 3000

# Step 1: Shipping
- assertVisible:
    id: "shipping-form"

- tapOn:
    id: "shipping-name"
- inputText: "Test User"

- tapOn:
    id: "shipping-street"
- inputText: "123 Test Street"

- tapOn:
    id: "shipping-city"
- inputText: "Test City"

- tapOn:
    id: "shipping-state"
- inputText: "CA"

- tapOn:
    id: "shipping-zip"
- inputText: "12345"

- tapOn:
    id: "shipping-phone"
- inputText: "555-555-5555"

- tapOn:
    id: "next-btn"

# Step 2: Payment
- assertVisible:
    id: "payment-form"
    timeout: 3000

- tapOn:
    id: "payment-card-number"
- inputText: "4111111111111111"

- tapOn:
    id: "payment-cardholder"
- inputText: "Test User"

- tapOn:
    id: "payment-expiry"
- inputText: "12/28"

- tapOn:
    id: "payment-cvv"
- inputText: "123"

- tapOn:
    id: "next-btn"

# Step 3: Review
- assertVisible:
    id: "order-review"
    timeout: 3000

- assertVisible:
    text: "123 Test Street"
- assertVisible:
    text: "****1111"

# Place order
- tapOn:
    id: "place-order-btn"

# Order confirmation
- assertVisible:
    text: "Order Placed"
    timeout: 5000

- tapOn:
    text: "View Orders"

# ============================================
# PHASE 8: ORDERS
# ============================================

- assertVisible:
    id: "orders-screen"
    timeout: 3000

- assertVisible:
    id: "orders-list"

# Verify order status
- assertVisible:
    text: "Processing"
    timeout: 3000

# ============================================
# PHASE 9: PROFILE
# ============================================

- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"
    timeout: 3000

# Verify profile elements
- assertVisible:
    id: "profile-header"
- assertVisible:
    id: "stats-card"

# Menu items
- assertVisible:
    id: "menu-orders"
- assertVisible:
    id: "menu-settings"
- assertVisible:
    id: "menu-logout"

# ============================================
# PHASE 10: SETTINGS
# ============================================

- tapOn:
    id: "menu-settings"
- assertVisible:
    id: "settings-screen"
    timeout: 3000

# Test dark mode toggle
- tapOn:
    id: "toggle-dark-mode"
- tapOn:
    id: "toggle-dark-mode"

# Back to profile
- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"
    timeout: 3000

# ============================================
# PHASE 11: CART IS EMPTY AFTER ORDER
# ============================================

- tapOn:
    text: "Cart"
- assertVisible:
    id: "cart-screen-empty"
    timeout: 3000

- assertVisible:
    text: "Your cart is empty"

# ============================================
# PHASE 12: CLEANUP - Logout
# ============================================

- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"
    timeout: 3000

- tapOn:
    id: "menu-logout"
- assertVisible:
    text: "Sign Out"
    timeout: 2000
- tapOn:
    text: "Sign Out"

- assertVisible:
    id: "guest-view"
    timeout: 3000

# ============================================
# SUITE COMPLETE
# ============================================
