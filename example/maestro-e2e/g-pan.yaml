appId: com.ennio.example
name: "Gauntlet — Pan gesture"
---
- launchApp:
    clearState: true
- tapOn: "Gauntlet"
- scrollUntilVisible:
    element:
      id: "g-pan"
    direction: DOWN
- tapOn:
    id: "g-pan"
- assertVisible:
    id: "pan-screen"
- assertVisible:
    id: "pan-box"
- tapOn:
    id: "pan-reset"
- assertVisible:
    text: "Resets: 1"
